<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xàbia Eats">
<meta name="theme-color" content="#f5f3ef">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>Xàbia Eats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: travel-app feed — photo cards on a warm off-white ground, serif titles, one terracotta accent, bottom bar with a round centre button */
:root{
  --bg:#f5f3ef; --card:#ffffff; --ink:#1d2229; --muted:#838891; --line:#ebe7e1;
  --accent:#d4622e; --accent-dark:#b94f1f; --accent-soft:#fbeadf;
  --open:#2c8553; --soon:#c0771a; --closed:#979ca3; --mich:#b8333a; --warn-bg:#fdf1dc; --warn:#8a5a0c;
  --display:'DM Serif Display',Georgia,'Times New Roman',serif;
  --body:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px; --shadow:0 6px 22px rgba(40,30,20,.08);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.phone.detail{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.pad{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:6px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em}
.brand i{color:var(--accent);font-style:italic}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.hello{padding-top:10px}
.hello p{color:var(--muted);font-size:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.005em;text-wrap:balance}
.hello h1{font-size:32px;line-height:1.1;margin-top:2px}
.pagetitle{font-size:30px;line-height:1.1;padding-top:6px}
.lead{color:var(--muted);font-size:14px;margin-top:4px}

.search{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;padding:13px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;text-align:left}
.search svg{width:18px;height:18px;flex:none}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}

.when{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px 8px}
.when .r{display:flex;align-items:center;gap:8px}
.when svg{width:18px;height:18px;color:var(--accent);flex:none}
.when select{border:0;background:transparent;font-weight:600;cursor:pointer;max-width:55%}
.when .t{font-weight:600;font-variant-numeric:tabular-nums}
.when .now{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600;cursor:pointer}
.when .now.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:4px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px max(18px,env(safe-area-inset-right)) 4px max(18px,env(safe-area-inset-left));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.x{padding-right:8px;display:inline-flex;align-items:center;gap:4px;cursor:default}
.chip.x button{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 4px}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 4px 10px;cursor:pointer;font-size:12px;font-weight:600;line-height:1.2;text-align:center}
.cat i{font-style:normal;font-size:24px;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.cat.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cat.on i{background:rgba(255,255,255,.22)}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toggles .chip{font-size:13px;padding:6px 13px}
#recmap{height:260px;border-radius:var(--r);overflow:hidden;background:var(--line);box-shadow:var(--shadow);margin-top:16px}
.lg::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg.pick::before{background:var(--accent)}.lg.later::before{background:#a7adb4}.lg.wait::before{background:var(--soon)}
.card.hero-card{width:100%;max-width:none;cursor:pointer}
.hero-card .ph{height:190px}
.hero-card.pick{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.hero-card.wait,.hero-card.first{box-shadow:0 0 0 2px #e3b46f,var(--shadow)}
.hero-card.wait .ph,.hero-card.first .ph{height:150px}
.pickbadge{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px}
.pickbadge svg{width:13px;height:13px}
.pickbadge.wait{background:var(--warn-bg);color:var(--warn)}
.why{font-size:13px;color:#4b5059}
.newtag{font-size:11px;font-weight:700;color:#2f6f86;background:#e2eef3;border-radius:6px;padding:1px 6px}
.bills .pcard{margin-bottom:0}
.bsync{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.bsync i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:4px}
.bsync.s-live i{background:var(--open)}.bsync.s-saving i{background:#5b5f9e}.bsync.s-offline i,.bsync.s-error i{background:#b23a2a}
.cap{display:grid;grid-template-columns:96px 1fr;gap:14px}
.shot{position:relative;border:1.5px dashed #d6d0c7;border-radius:14px;min-height:124px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);overflow:hidden;cursor:pointer;padding:6px}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.capf{min-width:0}
.paidin{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:var(--card)}
.paidin:focus-within{border-color:var(--accent)}
.paidin span{color:var(--muted);font-size:18px}
.paidin input{border:0;outline:0;background:transparent;font-size:22px;font-weight:700;padding:9px 6px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.brow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.brow .btn{padding:9px 16px;font-size:14px}
.small.err{color:#b23a2a}
.manual{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.seg2,.seg3{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px;gap:3px;margin-top:4px}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg2 button,.seg3 button{border:0;background:none;border-radius:99px;padding:7px 4px;font-size:13px;font-weight:600;cursor:pointer}
.seg2 button.on{background:var(--ink);color:#fff}
.seg3 button.u.on{background:#1f7a6c;color:#fff}.seg3 button.w.on{background:#c8681c;color:#fff}.seg3 button.s.on{background:#5b5f9e;color:#fff}
.money{text-align:right;font-variant-numeric:tabular-nums}
.receipt{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 0 14px;overflow:hidden}
.place{display:block;width:calc(100% - 28px);margin:0 14px 6px;border:0;border-bottom:1px dashed var(--line);background:transparent;font-family:var(--display);font-size:20px;padding:4px 0 8px;outline:none}
.hint{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);padding:4px 14px 6px}
.hint .l{color:#1f7a6c}.hint .r{color:#c8681c}
ul.items{list-style:none}
li.item{position:relative;overflow:hidden;border-bottom:1px dotted var(--line)}
.under{pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;font-weight:700;color:#fff;opacity:0}
.under.toW{background:#c8681c;justify-content:flex-start;opacity:1}.under.toU{background:#1f7a6c;justify-content:flex-end;opacity:1}
.face{position:relative;background:var(--card);padding:12px 14px;display:flex;align-items:center;gap:10px;touch-action:pan-y;transition:transform .2s;cursor:pointer;user-select:none;-webkit-user-select:none}
.face.dragging{transition:none}
.mark{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.item[data-side="us"] .mark{background:#1f7a6c;border-color:#1f7a6c}.item[data-side="wass"] .mark{background:#c8681c;border-color:#c8681c}
.item[data-side="shared"] .mark{background:linear-gradient(90deg,#1f7a6c var(--u,67%),#c8681c 0);border-color:transparent}
.iname{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:500;font-size:14px}
.iname .l1,.iname .orig{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iname .orig{font-size:12px;color:var(--muted);font-style:italic;font-weight:400}
.item[data-side=""] .iname{font-weight:700}
.qty{color:var(--muted);font-size:12px;margin-right:4px}
.item .who{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.item[data-side="us"] .who{color:#1f7a6c}.item[data-side="wass"] .who{color:#c8681c}.item[data-side="shared"] .who{color:#5b5f9e}
.item .amt{flex:none;font-weight:700;font-variant-numeric:tabular-nums;min-width:4.6em;text-align:right}
.tray{padding:2px 14px 14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.tray .chip{padding:5px 11px;font-size:13px}
.extras{display:flex;flex-wrap:wrap;gap:14px;border-top:1px dashed var(--line);padding-top:6px}
.link.danger{color:#a63a3a}
.rfoot{padding:10px 14px 0;display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.rfoot div{display:flex;justify-content:space-between;gap:10px}
.rfoot .tot{font-weight:800;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:11px 12px;font-weight:700;text-align:left;cursor:pointer;font-size:14px}
.choice button small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.choice button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice button.u.on{border-color:#1f7a6c;box-shadow:inset 0 0 0 1px #1f7a6c}.choice button.w.on{border-color:#c8681c;box-shadow:inset 0 0 0 1px #c8681c}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.side{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.side h3{font-size:17px;margin-bottom:2px}.side.u h3{color:#1f7a6c}.side.w h3{color:#c8681c}
.side .ln{display:flex;justify-content:space-between;color:var(--muted)}.side .ln b{color:var(--ink);font-weight:600}
.side .big{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:800}
.verdict{margin-top:14px;border-radius:20px;padding:18px;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:4px}
.verdict .vwho{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.verdict .vamt{font-family:var(--display);font-size:34px;line-height:1.05}
.verdict .vsub{font-size:13px;opacity:.85}
.verdict.pending{background:var(--card);color:var(--muted);border:1.5px dashed #d6d0c7}
.verdict.pending .vamt{font-size:20px;color:var(--ink)}
pre.sql{background:#1d2229;color:#f5f3ef;border-radius:14px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre;margin-top:8px}
.spotpin{display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(8px)}
.spotpin i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.spotpin span{background:#fff;color:var(--ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;box-shadow:0 1px 5px rgba(0,0,0,.2);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.poi{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:456px;z-index:8}
.poi .pcard{box-shadow:0 10px 40px rgba(0,0,0,.18)}
.poi .pcard h3 i{display:none}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:24px;margin-bottom:12px}
.sec h2{font-size:23px}
.sec span{color:var(--muted);font-size:13px}

/* big photo cards in a horizontal rail */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left));scroll-padding:0 18px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:78%;max-width:340px;scroll-snap-align:start;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.rail .card:only-child{width:100%;max-width:none}
.ph{position:relative;height:170px;margin:8px 8px 0;border-radius:16px;overflow:hidden}
.ph img,.noph{width:100%;height:100%;object-fit:cover;display:block}
.noph{display:grid;place-items:center;background:linear-gradient(135deg,var(--t1),var(--t2));color:rgba(29,34,41,.55);font-family:var(--display);font-size:46px}
.loc{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(29,34,41,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:600;padding:5px 10px 5px 8px;border-radius:99px}
.loc svg{width:13px;height:13px}
.fav{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.fav svg{width:18px;height:18px}
.fav.on{background:var(--accent);color:#fff}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ct h3{font-size:20px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.stat{text-align:right;flex:none;line-height:1.15}
.stat b{display:block;font-size:14px}
.stat small{color:var(--muted);font-size:12px}
.s-open b,.s-open .dotc{color:var(--open)}.s-soon b,.s-soon .dotc{color:var(--soon)}.s-closed b,.s-unknown b{color:var(--closed)}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px;align-items:center}
.facts span{display:inline-flex;align-items:center;gap:4px}
.facts svg{width:14px;height:14px}
.star{color:#e0a526}
.match{color:var(--accent-dark);font-size:13px;font-weight:600}
.mich{display:inline-flex;align-items:center;gap:3px;background:var(--mich);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;letter-spacing:.01em}
.flag{display:inline-block;font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px}
.flag.ok{background:#e3f1e8;color:var(--open)}.flag.warn{background:var(--warn-bg);color:var(--warn)}

/* compact rows */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.thumb{width:58px;height:58px;border-radius:14px;overflow:hidden;flex:none}
.thumb img,.thumb .noph{width:100%;height:100%;object-fit:cover;font-size:24px}
.grow{flex:1;min-width:0}
.rname{font-family:var(--display);font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.rmeta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;margin-top:2px}
.dotc::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.s-closed .dotc,.s-unknown .dotc{color:var(--closed)}
.add{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.add svg{width:17px;height:17px}
.add.on{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}

.note{border-radius:18px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.45;background:var(--accent-soft)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note b{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;padding:13px 22px;cursor:pointer;text-decoration:none;font-size:15px}
.btn svg{width:18px;height:18px}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:#a63a3a;border:1px solid var(--line)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.link{background:none;border:0;color:var(--accent-dark);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:none}

/* detail */
.hero{position:relative;height:340px;background:var(--line)}
.gal{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:none;width:100%;height:100%;scroll-snap-align:start;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .noph{font-size:90px}
.credit{position:absolute;left:12px;bottom:34px;color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.credit a{color:#fff}
.round{position:absolute;top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.round svg{width:20px;height:20px}
.round.l{left:max(16px,env(safe-area-inset-left))}.round.r{right:max(16px,env(safe-area-inset-right))}
.round.r2{right:calc(max(16px,env(safe-area-inset-right)) + 54px)}
.round.on{background:var(--accent);color:#fff}
.dots{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.dots i.on{background:#fff;width:16px;border-radius:4px}
.sheet{position:relative;margin-top:-22px;background:var(--bg);border-radius:26px 26px 0 0;padding-top:22px}
.kicker{display:inline-flex;align-items:center;gap:5px;color:var(--accent-dark);font-size:13px;font-weight:600}
.kicker svg{width:14px;height:14px}
.dtitle{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:6px}
.dtitle h1{font-size:30px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.dtitle .stat b{font-size:16px}
.desc{color:#4b5059;margin-top:12px;font-size:15px}

/* ================= opening hours ================= */
function weekly(periods){
  if(!periods) return null;
  return periods.map(p=>{
    if(!p.close) return [0,20160];
    const s=p.open.day*1440+p.open.hour*60+p.open.minute;
    let e=p.close.day*1440+p.close.hour*60+p.close.minute; if(e<=s) e+=10080; return [s,e];
  });
}
function hoursFor(p,D){
  if(p.cur&&p.curFrom){const k=dayDiff(p.curFrom,D);if(k>=0&&k<7) return {w:p.cur,src:'current',special:(p.special||[]).includes(D)}}
  if(p.reg) return {w:p.reg,src:'regular',special:false};
  return null;
}
function dayRanges(w,dow){
  const a=dow*1440,b=a+1440,out=[];
  for(const[s,e]of w){
    if(e-s>=10080){out.push([0,1440]);continue}
    for(const off of [0,10080,-10080]){const ss=s+off,ee=e+off;if(ss<b&&ee>a&&ss>=a-1440) out.push([Math.max(ss,a)-a,Math.min(ee,b+600)-a])}
  }
  const seen=new Set();return out.filter(([s,e])=>{const k=s+'-'+e;if(seen.has(k)||s>=1440||s<0)return false;seen.add(k);return true}).sort((x,y)=>x[0]-y[0]);
}
const holidayOn=D=>data.holidays.find(h=>h.date===D);
// returns {s, big, small, txt}
function status(p,D,m){
  if(!D){({date:D,min:m}=when())}
  if((p.closedOn||[]).includes(D)) return {s:'closed',big:'Closed',small:'your note',txt:'Closed (your note)'};
  if(p.biz==='CLOSED_PERMANENTLY') return {s:'closed',big:'Closed',small:'permanently',txt:'Permanently closed'};
  if(p.biz==='CLOSED_TEMPORARILY') return {s:'closed',big:'Closed',small:'temporarily',txt:'Temporarily closed'};
  const h=hoursFor(p,D);
  if(!h) return {s:'unknown',big:'Hours',small:p.gid?'not listed':'not loaded',txt:p.gid?'No hours on Google':(data.key?'Hours loading…':'Hours need Google')};
  const t=dowOf(D)*1440+m;
  for(const[s,e]of h.w) for(const tt of [t,t+10080]) if(tt>=s&&tt<e){const all=e-s>=10080;return {s:'open',left:e-tt,big:'Open',small:all?'24 hours':`until ${fmt(e)}`,txt:all?'Open 24 hours':`Open until ${fmt(e)}`,h}}
  const dayEnd=(dowOf(D)+1)*1440; let next=null;
  for(const[s]of h.w) if(s>t&&s<dayEnd&&(next===null||s<next)) next=s;
  if(next!==null) return {s:'soon',wait:next-t,big:'Opens',small:`at ${fmt(next)}`,txt:`Opens at ${fmt(next)}`,h};
  const any=dayRanges(h.w,dowOf(D)).length;
  return {s:'closed',big:'Closed',small:any?'for the day':'all day',txt:any?'Closed for the day':'Closed all day',h};
}
function flagsFor(p,D){
  const hol=holidayOn(D), h=hoursFor(p,D);
  if(h&&h.special) return `<span class="flag ok">✓ ${hol?'Holiday':'Special'} hours confirmed</span>`;
  if(hol&&p.gid&&h&&h.src==='current') return `<span class="flag ok">✓ Checked for ${esc(hol.name)}</span>`;
  if(hol) return `<span class="flag warn">Holiday · call ahead</span>`;
  return '';
}

/* ================= preferences ================= */
function matches(p){
  const out=[],seen=new Set(),hay=[...(p.menu||[]),p.note||'',p.name,p.type||''].join(' | ').toLowerCase();
  ['Any venue',...p.tags].forEach(c=>(data.prefs[c]||[]).forEach(pref=>{
    const k=pref.toLowerCase().trim(); if(!k||seen.has(k)) return;
    let hit=(p.menu||[]).find(x=>x.toLowerCase().includes(k))||(hay.includes(k)||p.tags.some(t=>t.toLowerCase()===k)?pref:null);
    if(!hit){const g=GOOGLE_KW.find(([re,f])=>re.test(k)&&p.serves&&p.serves[f]);if(g) hit=pref}
    if(hit){seen.add(k);out.push(hit)}
  }));
  return out;
}

/* ================= Google ================= */
let gPromise=null;
function gmaps(){
  if(gPromise) return gPromise;
  if(!data.key) return Promise.reject(new Error('No Google key yet. Add one in Settings.'));
  gPromise=new Promise((res,rej)=>{
    window.__gmInit=async()=>{try{
      const [pl,mp,mk]=await Promise.all([window.google.maps.importLibrary('places'),window.google.maps.importLibrary('maps'),window.google.maps.importLibrary('marker')]);
      state.keyStatus='ok';res({Place:pl.Place,Map:mp.Map,Marker:mk.AdvancedMarkerElement,Pin:mk.PinElement});
    }catch(e){state.keyStatus='bad';rej(e)}};
    window.gm_authFailure=()=>{state.keyStatus='bad';toast('Google rejected the API key. Check it in Settings.');renderSoft()};
    const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(data.key)}&v=weekly&loading=async&callback=__gmInit&language=en&region=ES`;
    s.async=true;s.onerror=()=>{state.keyStatus='bad';rej(new Error('Couldn’t reach Google. Are you online?'))};
    document.head.append(s);
  });
  gPromise.catch(()=>renderSoft());
  return gPromise;
}
async function gSearch(q,max=8){
  const g=await gmaps();
  const {places}=await g.Place.searchByText({textQuery:q,fields:SEARCH_FIELDS,locationBias:{center:HOME,radius:9000},maxResultCount:max,language:'en',region:'es'});
  return (places||[]).map(x=>({gid:x.id,name:x.displayName,addr:x.formattedAddress,type:x.primaryTypeDisplayName,lat:x.location&&x.location.lat(),lng:x.location&&x.location.lng()}));
}
async function gDetails(gid){
  const g=await gmaps(), pl=new g.Place({id:gid});
  try{await pl.fetchFields({fields:DETAIL_FIELDS})}catch(e){await pl.fetchFields({fields:CORE_FIELDS})}
  return pl;
}
function applyDetails(p,pl){
  p.gid=pl.id; p.gname=pl.displayName||p.gname;
  p.addr=pl.formattedAddress||p.addr||'';
  if(pl.location){p.lat=pl.location.lat();p.lng=pl.location.lng();p.approx=false;p.area=areaFor(p.lat,p.lng,p.area==='Inland'?'Inland':'Xàbia')}
  p.phone=pl.internationalPhoneNumber||pl.nationalPhoneNumber||p.phone||'';
  p.web=pl.websiteURI||p.web||''; p.maps=pl.googleMapsURI||p.maps||'';
  p.rating=pl.rating??null; p.ratingCount=pl.userRatingCount??null;
  p.price=PRICE[String(pl.priceLevel||'').toUpperCase()]||'';
  p.type=pl.primaryTypeDisplayName||p.type||''; p.biz=String(pl.businessStatus||'').toUpperCase();
  const ro=pl.regularOpeningHours, co=pl.currentOpeningHours;
  p.reg=ro&&ro.periods?weekly(ro.periods):null;
  if(co&&co.periods){p.cur=weekly(co.periods);p.curFrom=madridNow().date;p.special=(co.specialDays||[]).map(isoOf).filter(Boolean)}else{p.cur=null;p.curFrom=null;p.special=[]}
  if(pl.photos&&pl.photos.length&&!(p.photo&&p.photo.resolved)){const ph=pl.photos[0];p.photo={src:ph.getURI({maxWidth:800,maxHeight:800}),by:(ph.authorAttributions||[]).map(a=>({name:a.displayName,uri:a.uri})),resolved:false}}
  delete p.gphotos;
  p.serves={coffee:pl.servesCoffee,breakfast:pl.servesBreakfast,brunch:pl.servesBrunch,lunch:pl.servesLunch,dinner:pl.servesDinner,beer:pl.servesBeer,wine:pl.servesWine,cocktails:pl.servesCocktails,dessert:pl.servesDessert,vegetarian:pl.servesVegetarianFood,outdoor:pl.hasOutdoorSeating};
  if(!p.autoTagged){
    const s=p.serves,types=pl.types||[],add=t=>{if(!p.tags.includes(t))p.tags.push(t)};
    if(s.breakfast||s.brunch)add('Breakfast'); if(s.lunch)add('Lunch'); if(s.dinner)add('Dinner');
    if(s.cocktails)add('Drinks'); if(s.dessert)add('Dessert');
    if(types.includes('bakery'))add('Bakery'); if(types.includes('seafood_restaurant'))add('Seafood');
    p.autoTagged=true;
  }
  p.updated=Date.now(); p.linkFailed=false;
}
// Turn Google's photo link into a direct image address once, so showing it again costs nothing
async function resolvePhoto(p){
  if(!p.photo||p.photo.resolved||p.photo.tried||!data.key) return false;
  p.photo.tried=true;
  try{
    const u=new URL(p.photo.src);
    if(u.hostname==='places.googleapis.com'){
      u.searchParams.set('skipHttpRedirect','true'); if(!u.searchParams.get('key')) u.searchParams.set('key',data.key);
      const j=await (await fetch(u.toString())).json();
      if(j.photoUri){p.photo.src=j.photoUri;p.photo.resolved=true;p.photoAt=Date.now();delete p.photo.tried;save();return true}
    }else{p.photo.resolved=true;p.photoAt=Date.now();delete p.photo.tried;save();return true}
  }catch(e){console.warn('photo',e)}
  return false;
}
let syncing=false;
async function syncAll(force){
  if(!data.key||syncing) return; syncing=true;
  const today=madridNow().date;
  if(force) data.places.forEach(p=>p.linkFailed=false);
  const todo=data.places.filter(p=>force||!p.gid||!p.updated).filter(p=>force||!p.linkFailed);
  let i=0,ok=0;
  for(const p of todo){
    i++; state.sync=`Updating from Google… ${i} of ${todo.length}`; renderSync();
    try{
      if(!p.gid){const r=await gSearch(p.query||`${p.name}, Xàbia`,1);if(!r.length){p.linkFailed=true;state.lastErr=`Google found no match for “${p.name}”`;continue}p.gid=r[0].gid}
      applyDetails(p,await gDetails(p.gid)); await resolvePhoto(p); save(); ok++;
    }catch(e){console.warn(p.name,e);state.lastErr=String(e&&e.message||e);if(state.keyStatus==='bad')break}
  }
  syncing=false; state.sync=state.keyStatus==='bad'?'':(todo.length?`Updated ${ok} of ${todo.length} places from Google`+(ok===0&&state.lastErr?` — Google said: ${state.lastErr}`:''):''); save(); renderSoft();
  if(!(ok===0&&state.lastErr)) setTimeout(()=>{state.sync='';renderSync()},4000);
}

  for(let i=0;i<7;i++) set.add(addDays(today,i));
  const {from,to}=data.trip;
  if(from&&to&&dayDiff(from,to)>=0&&dayDiff(from,to)<45) for(let d=from;dayDiff(d,to)>=0;d=addDays(d,1)) if(dayDiff(today,d)>=0) set.add(d);

function renderList(){
  const el=document.getElementById('list'); if(!el) return;
  const cat=catOf(), list=candidates(cat);
  const S=new Map(list.map(p=>[p.id,status(p)])), SC=new Map(list.map(p=>[p.id,score(p)]));
  const by=s=>list.filter(p=>S.get(p.id).s===s).sort((a,b)=>SC.get(b.id)-SC.get(a.id));
  const open=by('open'), soon=by('soon'), closed=by('closed'), unk=by('unknown');
  const pick=open[0]||null;
  const waitPool=soon.filter(p=>S.get(p.id).wait<=150);
  // 'much better' = Google rating at least 0.3 higher, or clearly higher overall score
  const wait=pick?(waitPool.find(p=>(p.rating!=null&&pick.rating!=null&&p.rating>=pick.rating+.3)||SC.get(p.id)>=SC.get(pick.id)+.25)||null)
    :([...soon].sort((a,b)=>S.get(a.id).wait-S.get(b.id).wait||SC.get(b.id)-SC.get(a.id))[0]||null);
  const waitKind=pick?'wait':'first';
  const rest=open.slice(1), later=soon.filter(p=>p!==wait);
  [pick,wait].forEach(x=>{if(x&&x.photo&&!x.photo.resolved&&!x.photo.tried)resolvePhoto(x).then(ok=>{if(ok)renderList()})});
  state.recPins=[...(pick?[[pick,'pick']]:[]),...(wait?[[wait,waitKind]]:[]),...rest.slice(0,12).map(p=>[p,'open']),...later.slice(0,6).map(p=>[p,'soon'])];
  const label=state.when?`at ${fmt(when().min)}`:'now';
  let html='';
  if(data.key) html+=`<div class="pad"><div id="recmap"><div class="empty" style="padding-top:110px">Loading map…</div></div>
     <div class="legend">${pick?'<span class="lg pick">Our pick</span>':''}${wait?`<span class="lg wait">${waitKind==='first'?'Opens first':'Worth the wait'}</span>`:''}${rest.length?'<span class="s-open"><span class="dotc">Open</span></span>':''}${later.length?'<span class="lg later">Opens later</span>':''}${data.spots.length?`<span>${data.spots.map(s=>kindOf(s).glyph+' '+esc(s.name)).join(' · ')}</span>`:''}</div></div>`;
  if(pick) html+=`<div class="pad" style="margin-top:16px">${heroCard(pick,'pick',S.get(pick.id))}</div>`;
  else if(list.length&&!unk.length) html+=`<div class="pad"><div class="note" style="background:var(--card)">Nothing in <b>${esc(cat.label.toLowerCase())}</b> is open ${label}${data.only4?' with 4★ or more':''}.${soon.length?' Here’s what opens first.':''}</div></div>`;
  if(wait) html+=`<div class="pad" style="margin-top:14px">${heroCard(wait,waitKind,S.get(wait.id))}</div>`;
  if(rest.length) html+=`<div class="pad">${sec(`Also open ${label}`,`${rest.length}`)}<div class="list">${rest.map(row).join('')}</div></div>`;
  if(later.length) html+=`<div class="pad">${sec('Opening later',`${later.length}`)}<div class="list">${later.map(row).join('')}</div></div>`;
  if(unk.length) html+=`<div class="pad">${sec(data.key?'Hours unknown':'Your saved places',`${unk.length}`)}<div class="list">${unk.map(row).join('')}</div></div>`;
  if(closed.length) html+=`<div class="pad">${state.showClosed?`${sec('Closed',`${closed.length}`)}<div class="list">${closed.map(row).join('')}</div>`:`<button class="link" style="display:block;margin:16px auto 0" onclick="state.showClosed=true;renderList()">Show ${closed.length} closed place${closed.length>1?'s':''}</button>`}</div>`;
  if(!list.length) html+=`<div class="pad"><div class="note" style="background:var(--card)">You haven’t added any ${esc(cat.label.toLowerCase())} places${data.only4?' rated 4★ or more':''} yet. <button class="link" onclick="state.addResults=null;push('add')">Add one</button>, or tap a business on the Map tab.</div></div>`;
  html+=`<div class="pad"><p class="small" style="text-align:center;margin-top:18px">Times are Xàbia time. Picks weigh Google rating, your ♥ preferences and Michelin.</p></div>`;
  el.innerHTML=html;
  renderDiscNote();
  drawRecMap();
}
async function drawRecMap(){
  const el=document.getElementById('recmap'); if(!el) return;
  try{
    const g=await gmaps(); if(!document.body.contains(el)) return;
    el.innerHTML='';
    const map=new g.Map(el,{center:HOME,zoom:13,mapId:'DEMO_MAP_ID',disableDefaultUI:true,zoomControl:true,gestureHandling:'cooperative',clickableIcons:false});
    const b=new window.google.maps.LatLngBounds(); let n=0;
    const style={pick:{bg:'#d4622e',sc:1.45,gl:'★'},wait:{bg:'#c0771a',sc:1.25,gl:'⏱'},first:{bg:'#c0771a',sc:1.25,gl:'⏱'},open:{bg:'#2c8553',sc:.9},soon:{bg:'#a7adb4',sc:.8}};
    [...(state.recPins||[])].reverse().forEach(([p,k])=>{
      if(p.lat==null||p.approx) return;
      const s=style[k], pin=new g.Pin({background:s.bg,borderColor:'#ffffff',glyphColor:'#ffffff',scale:s.sc,...(s.gl?{glyph:s.gl}:{})});
      const mk=new g.Marker({map,position:{lat:p.lat,lng:p.lng},title:p.name,content:pin.element||pin,gmpClickable:true,zIndex:k==='pick'?99:k==='wait'?98:1});
      mk.addListener('click',()=>openDetail(p.id)); if(nearHome(p)){b.extend({lat:p.lat,lng:p.lng}); n++;}
    });
    n+=addSpotMarkers(g,map,b);
    if(n>1) map.fitBounds(b,{top:40,right:30,bottom:30,left:30}); else if(n===1){map.setCenter(b.getCenter());map.setZoom(15)}
  }catch(e){el.innerHTML=`<div class="empty" style="padding-top:100px">The map couldn’t load.<br>${esc(e.message||'')}</div>`}
}

async function doSearch(q){

async function pickResult(i,relinkId){
  const r=state.addResults[i]; let p;
  if(relinkId){p=byId(relinkId);p.gid=r.gid;p.photo=null}
  else{
    const area=r.lat!=null?areaFor(r.lat,r.lng):'Xàbia';
    p={id:uid(),name:r.name,area,tags:[],menu:[],note:'',lat:r.lat,lng:r.lng,approx:false,gid:r.gid,addr:r.addr,type:r.type,michelin:''};

function addManual(f){

function hoursList(p){
  const D0=when().date, rows=[];
  for(let i=0;i<7;i++){
    const D=addDays(D0,i), h=hoursFor(p,D), hol=holidayOn(D);
    let txt='Not known';
    if((p.closedOn||[]).includes(D)) txt='Closed (your note)';
    else if(h){const r=dayRanges(h.w,dowOf(D));txt=r.length?r.map(([s,e])=>e-s>=1440?'24 hours':`${fmt(s)}–${fmt(e)}`).join(', '):'Closed'}
    rows.push(`<div class="hr ${i===0?'sel':''}"><span>${i===0&&!state.when?'Today':pretty(D)}${h&&h.special?' <span class="flag ok">special</span>':hol?' <span class="flag warn">holiday</span>':''}</span><span>${txt}</span></div>`);
  }
  return rows.join('');
}

const kindOf=s=>SPOT_KINDS.find(k=>k.k===s.kind)||SPOT_KINDS[2];
// Area label from the place's real position (nearest neighbourhood within ~1.6 km)
function areaFor(lat,lng,fallback){let best=null,bd=1.6;for(const[a,[la,ln]]of Object.entries(AREAS)){if(a==='Xàbia'||a==='Inland')continue;const d=km({lat,lng},{lat:la,lng:ln});if(d<bd){bd=d;best=a}}return best||fallback||'Xàbia'}
const nearHome=p=>p.lat!=null&&!p.approx&&km(HOME,p)<12;
const baseSpot=()=>data.spots.find(s=>s.id===data.base)||null;
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function distTxt(p){const b=baseSpot();if(!b||p.lat==null||p.approx)return '';const d=km(b,p);return d<1?`${Math.max(50,Math.round(d*1000/50)*50)} m`:`${d.toFixed(1)} km`}

function addSpotMarkers(g,map,bounds,skipId){

    el.innerHTML=`<i style="background:${k.col}">${k.glyph}</i><span>${esc(s.name)}</span>`;
    new g.Marker({map,position:{lat:s.lat,lng:s.lng},title:s.name,content:el,zIndex:500});
    if(bounds&&km(HOME,s)<12){bounds.extend({lat:s.lat,lng:s.lng});n++}
  });
  return n;
}

function spotLink(raw){
  const txt=(raw||'').trim(); let u=txt; try{u=decodeURIComponent(txt)}catch(e){}
  const pats=[/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/[?&](?:q|query|ll|sll|destination|center)=(-?\d{1,2}\.\d{3,}),\s*(-?\d{1,3}\.\d{3,})/,/(-?\d{1,2}\.\d{4,})\s*,\s*(-?\d{1,3}\.\d{4,})/];
  for(const re of pats){const m=u.match(re);if(m&&Math.abs(+m[1])<=90&&Math.abs(+m[2])<=180){state.spotHelp=null;setSpotPos(+m[1],+m[2],'from what you pasted',true);render(true);return}}
  const short=u.match(/https?:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)\/\S+/i);
  const words=u.replace(/https?:\/\/\S+/g,' ').replace(/\s+/g,' ').trim();
  if(words.length>=4&&data.key){state.spotHelp=null;if(!state.spotDraft.name)state.spotDraft.name=words.split(/[,\n]/)[0].slice(0,40);toast('Searching for the address in what you pasted…');spotSearch(words);return}
  state.spotHelp=short?{link:short[0]}:{link:null};render(true);
}
function saveSpot(){
  state.spotHelp=null;
  const d=state.spotDraft;if(d.lat==null){toast('Set a location first');return}
  const s={id:uid(),name:d.name.trim()||kindOf(d).label,kind:d.kind,lat:d.lat,lng:d.lng,addr:d.addr||''};
  data.spots.push(s);if(!data.base&&s.kind==='home')data.base=s.id;
  save();state.spotDraft=null;toast(`${s.name} added to the map`);pop();
}

/* --- Supabase REST --- */
async function sbFetch(path,opt={}){
  const c=SB(), h={apikey:c.key,'Content-Type':'application/json',...(opt.headers||{})};
  if(/^eyJ/.test(c.key)) h.Authorization='Bearer '+c.key;
  const r=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/'+path,{...opt,headers:h});
  if(!r.ok){let t='';try{const j=await r.json();t=j.message||j.hint||''}catch(e){}throw new Error(t||`Supabase said ${r.status}`)}
  if(r.status===204) return null; const txt=await r.text(); return txt?JSON.parse(txt):null;
}
const tripQ=()=>`trip=eq.${encodeURIComponent(SB().trip)}`;
const sbUpsert=rows=>sbFetch('splitter?on_conflict=trip,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});
const sbDelete=id=>sbFetch(`splitter?${tripQ()}&id=eq.${encodeURIComponent(id)}`,{method:'DELETE'});
const sbAll=()=>sbFetch(`splitter?${tripQ()}&select=id,kind,data,updated_at`);
const sbRow=(id,kind,d)=>({trip:SB().trip,id,kind,data:d,updated_at:new Date().toISOString()});
function setB(st,err){B.status=st;B.err=err||'';const el=document.getElementById('bsync');if(el)el.outerHTML=bSyncHtml()}
function bSyncHtml(){
  const n=NM(), t={live:`Shared with ${esc(n.b)} · live`,saving:'Saving…',offline:'Offline. Saved on this phone and will send when you’re back online.',local:'Only on this phone. Set up sharing in Settings.',error:'Couldn’t reach shared bills: '+esc(B.err)}[B.status]||'';
  return `<div id="bsync" class="bsync s-${B.status}"><i></i><span>${t}</span></div>`;
}
async function pushAll(){
  if(!SB()) return;
  const rows=[sbRow('bill','bill',B.bill),...B.meals.map(m=>sbRow(m.id,'meal',m))];
  await sbUpsert(rows);
  for(const id of B.deleted) await sbDelete(id);
  B.deleted=[];B.dirtyBill=false;B.dirtyMeals=false;localBills();
}
let pulling=false;
async function pullBills(){
  if(!SB()||pulling) return; pulling=true;
  try{
    if(B.dirtyBill||B.dirtyMeals||B.deleted.length){setB('saving');await pushAll()}
    const rows=await sbAll();
    if(!rows.length&&!B.seeded){B.seeded=true;setB('saving');await pushAll();setB('live');pulling=false;return}
    B.seeded=true;
    const br=rows.find(r=>r.id==='bill'), meals=rows.filter(r=>r.kind==='meal').map(r=>r.data).sort((a,b)=>a.at-b.at);
    let changed=false;
    if(br&&!B.dirtyBill&&(br.data.updated||0)>(B.bill.updated||0)){B.bill=br.data;changed=true}
    if(!B.dirtyMeals&&JSON.stringify(meals)!==JSON.stringify(B.meals)){B.meals=meals;changed=true}
    localBills(); setB('live');
    if(changed) billsRefresh();
  }catch(e){setB(navigator.onLine?'error':'offline',e.message)}
  pulling=false;
}
let billT;
function saveBill(){B.bill.updated=Date.now();B.dirtyBill=true;localBills();clearTimeout(billT);if(!SB())return;billT=setTimeout(async()=>{try{setB('saving');await sbUpsert([sbRow('bill','bill',B.bill)]);B.dirtyBill=false;setB('live')}catch(e){setB(navigator.onLine?'error':'offline',e.message)}},500)}
async function saveMeals(){B.dirtyMeals=true;localBills();if(!SB())return;try{setB('saving');await pushAll();setB('live')}catch(e){setB(navigator.onLine?'error':'offline',e.message)}}

/* --- maths (same rules as the original splitter) --- */
const toC=v=>{const n=parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,''));return isFinite(n)?Math.round(n*100):0};
const defWs=()=>{const n=NM();return n.hb/(n.ha+n.hb)};
const wsOf=it=>it.ws==null?defWs():it.ws;
const ratioLbl=w=>Math.round((1-w)*100)+'/'+Math.round(w*100);
const bMoney=c=>{const s=(Math.abs(c)/100).toFixed(2);return (c<0?'−':'')+(B.bill.cur||'€')+s};
const mMoney=(c,cur)=>(cur||'€')+(Math.abs(c)/100).toFixed(2);
function calc(){
  const S=B.bill; let us=0,wass=0,shared=0,sharedW=0,none=0,nNone=0;
  for(const it of S.items){if(it.side==='us')us+=it.c;else if(it.side==='wass')wass+=it.c;else if(it.side==='shared'){shared+=it.c;sharedW+=it.c*wsOf(it)}else{none+=it.c;nNone++}}
  const items=us+wass+shared+none, paidC=String(S.paid||'').trim()?toC(S.paid):items, extra=paidC-items;
  const wFood=wass+sharedW,uFood=us+shared-sharedW,food=wFood+uFood,n=NM();
  const wExtra=S.tipMode==='head'||food===0?extra*n.hb/(n.ha+n.hb):extra*wFood/food;
  const wTot=Math.round(wFood+wExtra),uTot=paidC-wTot;
  return {us,wass,shared,sharedW,none,nNone,items,paidC,extra,wFood,uFood,wExtra,uExtra:extra-wExtra,wTot,uTot};
}
const weOwe=()=>{const n=NM();return n.a==='Us'?`We owe ${n.b}`:`${n.a} owe ${n.b}`};
const theyOwe=()=>{const n=NM();return n.a==='Us'?`${n.b} owes us`:`${n.b} owes ${n.a}`};

function assignItem(it,side){it.side=side;B.openId=B.editId=null;saveBill();renderBillItems();renderBillTotals()}
function swipeItem(li,it){
  const face=li.querySelector('.face'),under=li.querySelector('.under'),n=NM();let x0=null,dx=0,active=false;
  face.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;active=false});
  face.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;
    if(!active&&Math.abs(dx)>10){active=true;face.classList.add('dragging');try{face.setPointerCapture(e.pointerId)}catch(_){}}
    if(!active)return;const d=Math.max(-140,Math.min(140,dx));face.style.transform=`translateX(${d}px)`;
    under.className='under '+(d>0?'toW':'toU');under.textContent=d>0?n.b:n.a;under.style.filter=Math.abs(d)>70?'':'saturate(.35)'});
  const end=()=>{if(x0===null)return;const was=active,d=dx;face.classList.remove('dragging');face.style.transform='';x0=null;active=false;
    if(was&&d<-70)return assignItem(it,'us');if(was&&d>70)return assignItem(it,'wass');
    setTimeout(()=>{under.className='under';under.textContent=''},200);
    if(!was){B.openId=B.openId===it.id?null:it.id;B.editId=null;renderBillItems()}};
  face.addEventListener('pointerup',end);
  face.addEventListener('pointercancel',()=>{x0=null;active=false;face.classList.remove('dragging');face.style.transform='';under.className='under';under.textContent=''});
  face.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();B.openId=B.openId===it.id?null:it.id;renderBillItems()}else if(e.key==='ArrowLeft')assignItem(it,'us');else if(e.key==='ArrowRight')assignItem(it,'wass')});
}

function shrinkB64(file,max=1600){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.85).split(',')[1])};im.onerror=rej;im.src=u})}
const BILL_PROMPT=`This photo is a restaurant bill or receipt, probably in Spanish. Extract every ordered line item.
Reply with ONLY JSON in this shape:
{"place":"Restaurant name or empty string","currency":"EUR","items":[{"name":"Patatas bravas","en":"Spicy fried potatoes","qty":2,"total":13.00}],"billTotal":45.60,"serviceIncluded":false,"serviceAmount":null,"serviceNote":""}
Rules:
- "name" is the item exactly as printed. "en" is a short, natural English translation a tourist would understand (same as name if already English).
- "total" is the LINE total as printed (qty × unit price), a number with no currency sign.
- Exclude subtotal, tax/IVA summary, total, payment, change and card lines.
- Cover or bread charges (pan, cubierto) are items.
- Do NOT list a service charge or tip (servicio, propina, service, gratuity) as an item. Instead set "serviceIncluded" true, "serviceAmount" to its amount, and "serviceNote" to the printed wording.
- Also set "serviceIncluded" true if the bill states service is included even with no amount. Set false if there is clearly no service charge. Use null only if you genuinely cannot tell.
- "billTotal" is the final total printed on the bill (including any service charge), or null if unreadable.
- If the image is not a bill, reply {"items":[]}.`;
async function gemini(b64,signal){
  let last;
  for(const model of ['gemini-2.5-flash','gemini-flash-latest','gemini-2.0-flash']){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(data.key)}`,{method:'POST',signal,headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:BILL_PROMPT},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){const t=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||'';return JSON.parse(t.replace(/^```(json)?|```$/g,'').trim())}
    last=j.error?.message||`Google said ${r.status}`;
    if(r.status!==404) break;
  }
  throw new Error(last);
}
async function readBill(){
  if(B.ctl){B.ctl.abort();return}
  if(!B.photo||!data.key) return;
  const st=document.getElementById('bStatus'),btn=document.getElementById('bRead');
  B.ctl=new AbortController();btn.textContent='Stop';B.readErr=false;B.readMsg='Reading the bill… this takes a few seconds.';st.textContent=B.readMsg;st.classList.remove('err');
  try{
    const d=await gemini(await shrinkB64(B.photo),B.ctl.signal);
    const items=Array.isArray(d?.items)?d.items:[];
    if(!items.length){B.readErr=true;B.readMsg='Couldn’t find any items on that photo. Try a sharper, flatter shot, or add them by hand.'}
    else{
      const cur={EUR:'€',GBP:'£',USD:'$'}[String(d.currency||'').toUpperCase()]||B.bill.cur;
      const its=items.map(x=>({id:uid(),name:String(x.en||x.name||'Item'),orig:String(x.name||''),qty:Math.max(1,parseInt(x.qty)||1),c:Math.round((+x.total||0)*100),side:null}));
      const sum=its.reduce((t,i)=>t+i.c,0), total=d.billTotal!=null?Math.round(+d.billTotal*100):sum;
      B.bill={...blankBill(cur),place:d.place||B.bill.place||'',items:its,bill:{total,inc:d.serviceIncluded===true?true:d.serviceIncluded===false?false:null,svc:d.serviceAmount?Math.round(+d.serviceAmount*100):0,note:d.serviceNote||''}};
      B.readMsg=`Found ${its.length} item${its.length>1?'s':''}${Math.abs(total-sum-(B.bill.bill.svc||0))>5?` (they add up to ${bMoney(sum)}; the bill says ${bMoney(total)}, so check for a missed line)`:''}. Now swipe each one.`;
      saveBill();
    }
  }catch(e){
    B.readErr=true;
    B.readMsg=e.name==='AbortError'?'Stopped.':/not been used|disabled|PERMISSION|blocked|API key/i.test(e.message)?`Photo reading isn’t switched on for your Google key yet. ${e.message}`:`Couldn’t read the bill: ${e.message}`;
  }
  B.ctl=null; renderBillsBody();
}

  return hdr+`<div class="pad"><h1 class="pagetitle">Food preferences</h1><p class="lead">What you’re hunting for. Places that match get a ♥ and move to the front.</p>
  <div style="margin-top:18px">${PREF_CATS.map((c,ci)=>{const items=data.prefs[c]||[];const n=c==='Any venue'?'Checked at every place':`${data.places.filter(p=>p.tags.includes(c)).length} saved places`;
   return `<div class="pcard"><h3><i>${PREF_ICON[c]}</i>${c}</h3><p class="small">${n}</p>
     <div class="chips wrap">${items.map((v,i)=>`<span class="chip x">${esc(v)}<button onclick="rmPref(${ci},${i})" aria-label="Remove ${esc(v)}">×</button></span>`).join('')}</div>
     <form class="frow" onsubmit="event.preventDefault();addPref(${ci},this.q)"><input class="field" name="q" id="pref${ci}" placeholder="Add, e.g. ${PREF_HINT[c]}"><button class="btn">Add</button></form></div>`}).join('')}</div>
  <p class="small" style="margin-top:6px">Preferences are checked against each place’s menu list, your notes and its type. Google also confirms general things like coffee, breakfast, wine, cocktails, vegetarian food and outdoor seating. It doesn’t know specific items like pistachio croissants, so add those to a place’s menu when you find them.</p></div>`;
}
function addPref(ci,inp){const v=inp.value.trim();if(!v)return;const c=PREF_CATS[ci];(data.prefs[c]=data.prefs[c]||[]).push(v);save();toast(`Looking for ${v}`);render(true);document.getElementById('pref'+ci)?.focus()}
function rmPref(ci,i){data.prefs[PREF_CATS[ci]].splice(i,1);save();render(true)}

/* ---------- SETTINGS ---------- */
function screenSettings(){
  const kTxt={ok:['ok','Connected'],bad:['bad','Not accepted'],loading:['none','Checking…'],none:['none','Not set']}[state.keyStatus]||['none',''];
  const {from,to}=data.trip;
  const hol=[...data.holidays].sort((a,b)=>a.date.localeCompare(b.date)).filter(h=>dayDiff(madridNow().date,h.date)>=-1);
  return `<header class="top pad"><button class="iconbtn" onclick="pop()" aria-label="Back">${I.back}</button><div class="brand">Settings</div><span style="width:42px"></span></header>
  <div class="pad">
  ${sec('Food preferences')}
  <div class="pcard" style="cursor:pointer" onclick="push('prefs')">
    ${PREF_CATS.filter(c=>(data.prefs[c]||[]).length).map(c=>`<div class="srow"><span>${PREF_ICON[c]} ${c}</span><span class="small" style="text-align:right">${esc(data.prefs[c].join(', '))}</span></div>`).join('')||'<p class="small">Nothing yet.</p>'}
    <button class="btn ghost block">Edit food preferences</button>
  </div>
  ${sec('Shared bills')}
  <div class="pcard" style="cursor:pointer" onclick="push('billsetup')"><div class="srow" style="padding:0"><span>${SB()?`Sharing with ${esc(NM().b)}`:'Only on this phone'}</span><span class="ks ${SB()?'ok':'none'}">${SB()?'On':'Off'}</span></div><button class="btn ghost block">${SB()?'Invite & settings':'Set up sharing'}</button></div>
  ${sec('Google Maps')}
  <form class="pcard" onsubmit="event.preventDefault();saveKey(this.k.value)">
    <div class="srow" style="padding-top:0"><span>API key</span><span class="ks ${kTxt[0]}">${kTxt[1]}</span></div>
    ${state.lastErr?`<div class="note warn" style="margin:0 0 10px;user-select:text">Last Google error: ${esc(state.lastErr)}</div>`:''}
    <input class="field" name="k" id="keyBox" type="password" autocomplete="off" placeholder="Paste your key (starts AIza…)" value="${esc(data.key)}">
    <button class="btn block">Save key</button>
    ${data.key?`<button type="button" class="btn ghost block" onclick="syncAll(true);toast('Refreshing every place…')">Re-check every place now (uses ~25 lookups)</button>`:''}
    <div class="srow" style="margin-top:6px"><label for="dscT">Also suggest top-rated places I haven’t added<br><span class="small">Off keeps the app to your own list.</span></label><input type="checkbox" id="dscT" ${data.discover?'checked':''} onchange="data.discover=this.checked;save()"></div>
    <div class="srow"><label for="phT">Show one Google photo per place</label><input type="checkbox" id="phT" ${data.showPhotos!==false?'checked':''} onchange="data.showPhotos=this.checked;save()"></div>
    <p class="small">The key is stored only on this device. Hours and one photo per place are loaded once. After that, Google is only asked when you tap “Check today’s hours”.</p>
  </form>
  ${sec('Your trip')}
  <div class="pcard" style="margin-bottom:12px"><div class="srow" style="padding:0"><span>Where you’re staying and friends’ places</span><button class="link" onclick="state.stack=[];state.tab='map';render()">Edit on Map →</button></div></div>
  <div class="pcard">
    <label class="lab" for="tripFrom" style="margin-top:0">From</label><input class="field" type="date" id="tripFrom" value="${from}" onchange="data.trip.from=this.value;save();render(true)">
    <label class="lab" for="tripTo">To</label><input class="field" type="date" id="tripTo" value="${to}" onchange="data.trip.to=this.value;save();render(true)">
    ${from&&to&&dayDiff(from,to)>=0?`<p class="small" style="margin-top:8px">${dayDiff(from,to)+1} days</p>`:''}
  </div>
  ${sec('Public holidays')}
  <div class="pcard">
    <p class="small" style="margin:0 0 6px">On these days the app tells you to call ahead unless Google has holiday hours. Spain’s fixed national and Valencian holidays are filled in. Add local fiestas and Easter yourself.</p>
    ${hol.map(h=>`<div class="srow"><span>${pretty(h.date)} ${h.date.slice(0,4)} · ${esc(h.name)}</span><button class="mini" onclick="rmHol('${h.date}')" aria-label="Remove">×</button></div>`).join('')}
    <form class="frow" onsubmit="event.preventDefault();addHol(this)"><input class="field" type="date" name="d" id="holDate" required style="max-width:46%"><input class="field" name="n" id="holName" placeholder="Name"><button class="btn">Add</button></form>
  </div>
  ${sec('Your data')}
  <div class="pcard">
    <p class="small" style="margin:0">Everything is saved on this device. Use a backup to move it to another phone or computer.</p>
    <button class="btn block" onclick="copyTransfer()">Copy transfer code</button>
    <form class="frow" onsubmit="event.preventDefault();pasteTransfer(this.c.value)"><input class="field" name="c" id="xferIn" placeholder="Paste a transfer code" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn">Use</button></form>
    <p class="small" style="margin-top:6px">To move everything to the home-screen icon or another phone, copy the code here and paste it there. It includes your Google key, places, notes, spots and bill sharing.</p>
    <button class="btn ghost block" onclick="exportBackup()">Download backup</button>
    <label class="btn ghost block" for="imp">Restore from backup</label><input type="file" id="imp" accept=".json,application/json" hidden onchange="importBackup(this)">
    <button class="btn danger block" onclick="resetAll()">${state.confirmDel==='ALL'?'Tap again to erase everything':'Start over with the starter list'}</button>
  </div>
  <p class="small" style="margin-top:14px">App version ${APP_VERSION}.</p>
  <p class="small" style="margin-top:6px">The starter list comes from the Guía Repsol 2026 list for Xàbia, javea.com and Nothing Familiar’s Jávea guide. Michelin badges follow the 2026 Michelin Guide Spain plus its March 2026 additions; the 2027 guide may change them, and you can edit each place’s badge. Hours, photos and ratings come from Google Maps.</p>
  </div>`;
}
function copyTransfer(){
  const pack={d:{...data},bill:B.bill,meals:B.meals};
  const code='XE1.'+btoa(unescape(encodeURIComponent(JSON.stringify(pack))));
  copyText(code,'Transfer code copied. Open the app on the other screen and paste it in Settings.');
}
function pasteTransfer(code){
  try{
    code=code.trim().replace(/\s/g,'');if(!code.startsWith('XE1.'))throw 0;
    const pack=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));
    if(!pack.d||!Array.isArray(pack.d.places))throw 0;
    data=Object.assign(defaultData(),pack.d);save();
    if(pack.bill){B.bill=pack.bill;B.meals=pack.meals||B.meals;localBills()}
    toast('Everything moved across. Reloading…');setTimeout(()=>location.reload(),900);
  }catch(e){toast('That isn’t a full transfer code. Copy it again and paste the whole thing.')}
}
function removeStarters(){
  if(state.confirmDel!=='SEEDS'){state.confirmDel='SEEDS';render(true);setTimeout(()=>{if(state.confirmDel==='SEEDS'){state.confirmDel=null;renderSoft()}},4000);return}
  const before=data.places.length;data.places=data.places.filter(p=>!p.seed||p.touched||data.plan.includes(p.id));state.confirmDel=null;save();
  toast(`Removed ${before-data.places.length} starter places`);render(true);
}
function saveKey(k){k=k.trim();if(k===data.key){toast('Key unchanged');return}data.key=k;save();toast(k?'Key saved. Reloading…':'Key removed');setTimeout(()=>location.reload(),600)}
function addHol(f){if(!f.d.value)return;data.holidays.push({date:f.d.value,name:f.n.value.trim()||'Holiday'});save();render(true)}
function rmHol(d){const i=data.holidays.findIndex(h=>h.date===d);if(i>=0)data.holidays.splice(i,1);save();render(true)}
function resetAll(){
  if(state.confirmDel!=='ALL'){state.confirmDel='ALL';render(true);return}
  const key=data.key;data=defaultData();data.key=key;state.confirmDel=null;save();toast('Starter list restored');render();syncAll();
}

/* ================= nav & render ================= */
function saveDisc(id){
  const d=byId(id); if(!d||!d.disc) return id;
  const ex=data.places.find(p=>p.gid===d.gid); if(ex) return ex.id;
  const p=JSON.parse(JSON.stringify(d)); p.id=uid(); delete p.disc; data.places.push(p); save();
  const top=state.stack.at(-1); if(top==='detail:'+id) state.stack[state.stack.length-1]='detail:'+p.id;
  return p.id;
}
function savePlace(id){const nid=saveDisc(id);toast(`${byId(nid).name} saved to your places`);render(true)}
function togglePlan(id){
  if(byId(id)?.disc) id=saveDisc(id);
  const i=data.plan.indexOf(id), p=byId(id);
  if(i>=0){data.plan.splice(i,1);data.done=data.done.filter(x=>x!==id);toast('Removed from your plan')}else{data.plan.push(id);toast(`${p.name} added to your plan`)}
  save(); render(true);
}
let toastT;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000)}
function push(s){state.confirmDel=null;state.stack.push(s);render()}
function pop(){state.confirmDel=null;state.stack.pop();render()}
function openDetail(id){push('detail:'+id)}

const TABS=[['today','Home',I.home],['saved','Saved',I.heart],['plan','Plan',I.route],['map','Map',I.map],['bills','Bills',I.receipt]];
function renderTabs(){
  const top=state.stack.at(-1), hide=top&&top.startsWith('detail:');
  document.getElementById('phone').classList.toggle('detail',!!hide);
  const t=document.getElementById('tabs'); t.hidden=!!hide; if(hide) return;
  t.innerHTML=TABS.map(([k,l,ic])=>{const on=state.tab===k&&!state.stack.length;
    return k==='plan'?`<button class="tab mid ${on?'on':''}" onclick="go('plan')" aria-label="Plan"><i>${ic}</i>${l}${data.plan.length?`<em class="badge">${data.plan.length}</em>`:''}</button>`
      :`<button class="tab ${on?'on':''}" onclick="go('${k}')">${ic}${l}</button>`}).join('');
}
function go(k){state.tab=k;state.stack=[];state.confirmDel=null;render()}
function renderSync(){const el=document.getElementById('sync');if(el)el.textContent=state.sync}
// re-render after background work, but never while someone is typing
function renderSoft(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return renderSync();if(['billsetup','settings','spot','add','prefs'].includes(state.stack.at(-1))||String(state.stack.at(-1)).startsWith('relink'))return renderSync();if(state.tab==='map'&&!state.stack.length)return renderSync();render(true)}
function render(keepScroll){
  const app=document.getElementById('app'), top=state.stack.at(-1);
  let html;
  if(top==='add') html=screenAdd();
  else if(top==='settings') html=screenSettings();
  else if(top==='spot') html=screenSpot();
  else if(top&&top.startsWith('relink:')) html=screenAdd(top.slice(7));
  else if(top&&top.startsWith('detail:')) html=screenDetail(top.slice(7));
  else if(top==='prefs') html=screenPrefs();
  else if(top==='billsetup') html=screenBillSetup();
  else html={today:screenToday,saved:screenSaved,map:screenMap,plan:screenPlan,bills:screenBills,prefs:screenPrefs}[state.tab]();
  const af=document.activeElement, fid=af&&af.id, pos=fid&&af.selectionStart!=null?af.selectionStart:null, y=window.scrollY;
  const rails=[...document.querySelectorAll('.rail')].map(r=>r.scrollLeft);
  app.innerHTML=html;
  document.querySelectorAll('.rail').forEach((r,i)=>{if(keepScroll&&rails[i])r.scrollLeft=rails[i]});
  if(!top&&state.tab==='today') {renderList();document.querySelectorAll('.rail').forEach((r,i)=>{if(keepScroll&&rails[i])r.scrollLeft=rails[i]})}
  if(!top&&state.tab==='map') drawMap();
  if(top==='spot') drawSpotMap();
  if(!top&&state.tab==='bills'){renderBillsBody();pullBills()}
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(pos!=null&&el.setSelectionRange)try{el.setSelectionRange(pos,pos)}catch(e){}}}
  window.scrollTo(0,keepScroll?y:0);
  renderTabs();
}
render();
if(data.key) gmaps().then(()=>{renderSoft();syncAll()}).catch(()=>{});
setInterval(()=>{if(!state.when&&!state.stack.length&&state.tab==='today'){const t=document.getElementById('tm');if(t)t.textContent=fmt(madridNow().min);renderList()}},60000);

</script>
</body>
</html>
