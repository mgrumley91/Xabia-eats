<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xàbia Guide">
<meta name="theme-color" content="#f5f3ef">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1">
<link rel="icon" type="image/png" href="favicon-64.png?v=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="referrer" content="no-referrer-when-downgrade">
<title>Xàbia Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: travel-app feed — photo cards on a warm off-white ground, serif titles, one terracotta accent, bottom bar with a round centre button */
:root{
  --bg:#f5f3ef; --card:#ffffff; --ink:#1d2229; --muted:#838891; --line:#ebe7e1;
  --accent:#d4622e; --accent-dark:#b94f1f; --accent-soft:#fbeadf;
  --open:#2c8553; --soon:#c0771a; --closed:#979ca3; --mich:#b8333a; --warn-bg:#fdf1dc; --warn:#8a5a0c;
  --display:'Bricolage Grotesque',Manrope,system-ui,sans-serif;
  --body:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px; --shadow:0 6px 22px rgba(40,30,20,.08);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);overflow-x:hidden;max-width:100%}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
.paidin input{font-size:22px!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:clip;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.phone.detail{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.pad{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:6px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em}
.brand i{color:var(--accent);font-style:italic}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.hello{padding-top:10px}
.hello p{color:var(--muted);font-size:14px}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.015em;text-wrap:balance}
.rname{font-weight:700}.brand{font-weight:800}
.hello h1{font-size:32px;line-height:1.1;margin-top:2px}
.pagetitle{font-size:30px;line-height:1.1;padding-top:6px}
.lead{color:var(--muted);font-size:14px;margin-top:4px}

.search{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;padding:13px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;text-align:left}
.search svg{width:18px;height:18px;flex:none}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}

.when{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px 8px}
.when .r{display:flex;align-items:center;gap:8px}
.when svg{width:18px;height:18px;color:var(--accent);flex:none}
.when select{border:0;background:transparent;font-weight:600;cursor:pointer;max-width:55%}
.when .t{font-weight:600;font-variant-numeric:tabular-nums}
.when .now{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600;cursor:pointer}
.when .now.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:4px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px max(18px,env(safe-area-inset-right)) 4px max(18px,env(safe-area-inset-left));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.x{padding-right:8px;display:inline-flex;align-items:center;gap:4px;cursor:default}
.chip.x button{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 4px}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 4px 10px;cursor:pointer;font-size:12px;font-weight:600;line-height:1.2;text-align:center}
.cat i{font-style:normal;font-size:24px;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.cat.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cat.on i{background:rgba(255,255,255,.22)}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toggles .chip{font-size:13px;padding:6px 13px}
#recmap{height:260px;border-radius:var(--r);overflow:hidden;background:var(--line);box-shadow:var(--shadow);margin-top:16px}
.lg::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg.pick::before{background:var(--accent)}.lg.later::before{background:#a7adb4}.lg.wait::before{background:var(--soon)}
.card.hero-card{width:100%;max-width:none;cursor:pointer}
.hero-card .ph{height:190px}
.hero-card.pick{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.hero-card.wait,.hero-card.first{box-shadow:0 0 0 2px #e3b46f,var(--shadow)}
.hero-card.wait .ph,.hero-card.first .ph{height:150px}
.pickbadge{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px}
.pickbadge svg{width:13px;height:13px}
.pickbadge.wait{background:var(--warn-bg);color:var(--warn)}
.why{font-size:13px;color:#4b5059}
.newtag{font-size:11px;font-weight:700;color:#2f6f86;background:#e2eef3;border-radius:6px;padding:1px 6px}
.bills .pcard{margin-bottom:0}
.bsync{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}
.bsync i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:4px}
.bsync.s-live i{background:var(--open)}.bsync.s-saving i{background:#5b5f9e}.bsync.s-offline i,.bsync.s-error i{background:#b23a2a}
.cap{display:grid;grid-template-columns:96px 1fr;gap:14px}
.shot{position:relative;border:1.5px dashed #d6d0c7;border-radius:14px;min-height:124px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);overflow:hidden;cursor:pointer;padding:6px}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.capf{min-width:0}
.paidin{display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:var(--card)}
.paidin:focus-within{border-color:var(--accent)}
.paidin span{color:var(--muted);font-size:18px}
.paidin input{border:0;outline:0;background:transparent;font-size:22px;font-weight:700;padding:9px 6px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.brow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.brow .btn{padding:9px 16px;font-size:14px}
.small.err{color:#b23a2a}
.manual{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.seg2,.seg3{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px;gap:3px;margin-top:4px}
.seg3{grid-template-columns:1fr 1fr 1fr}
.seg2 button,.seg3 button{border:0;background:none;border-radius:99px;padding:7px 4px;font-size:13px;font-weight:600;cursor:pointer}
.seg2 button.on,.seg3 button.on{background:var(--ink);color:#fff}
.bvr summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}.bvr summary::-webkit-details-marker{display:none}.bvr[open] summary>.small:last-child{transform:rotate(90deg)}
.bvrv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.bvrc{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}.bvrc.buy{border-top:4px solid #b07a1f}.bvrc.rent{border-top:4px solid #1f7a72}.bvrc b{font-size:22px;font-variant-numeric:tabular-nums}
.bsw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}.bvrsvg{margin-top:6px}.bvrsvg text{fill:var(--muted);font-size:21px}.pcard.bvr .small{display:block;text-align:left;margin:4px 0 0}.pcard.bvr .bvrc .small{margin:0}.pcard.bvr .bvrlg .small,.bvrlg span{display:inline}
.bvrs{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:14px;padding:4px 0}.bvrs output{font-variant-numeric:tabular-nums;font-weight:600}.bvrs input{grid-column:1/-1;width:100%;accent-color:#1f7a72}
.bvrt{border-collapse:collapse;width:100%;min-width:480px;font-size:13px}.bvrt th,.bvrt td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.bvrt th:first-child,.bvrt td:first-child{text-align:left}.bvrt th{color:var(--muted);font-weight:600}
.riskchips{padding:0!important;margin-top:4px;gap:6px}.riskchips .chip{padding:6px 11px;font-size:13px}
.riskleg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px;font-size:12.5px}
.riskleg div{display:flex;align-items:center;gap:8px;padding:2px 0}.riskleg img{width:20px;height:20px;flex:none}.riskleg i{width:20px;height:20px;flex:none}
.rbs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.rbs>span{font-size:11.5px;color:var(--muted)}
.rb{border-radius:8px;padding:2px 7px;font-weight:600}.rb.s0{background:#e3f2ea;color:#1f7a4c!important}.rb.s1{background:#f6efd9;color:#7a5a12!important}.rb.s2{background:#fbe6d6;color:#a8501c!important}.rb.s3{background:#f8dcdc;color:#a63a3a!important}
.riskline{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.riskline>span{font-size:20px}.riskline.s3 b{color:#a63a3a}.riskline.s2 b{color:#a8501c}.riskline.s0 b{color:#1f7a4c}
.homepin{display:flex;flex-direction:column;align-items:center;transform:translateY(4px)}.homepin i{font-style:normal;font-size:17px;background:#5b4bb7;border:2px solid #fff;border-radius:10px;padding:2px 4px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.homepin.short i{background:#d4622e}.homepin.no i{background:#9aa3ad}.homepin span{font-size:11px;font-weight:700;background:#fff;border-radius:6px;padding:1px 5px;margin-top:2px;box-shadow:0 1px 3px rgba(0,0,0,.2);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg3 button.u.on{background:#1f7a6c;color:#fff}.seg3 button.w.on{background:#c8681c;color:#fff}.seg3 button.s.on{background:#5b5f9e;color:#fff}
.money{text-align:right;font-variant-numeric:tabular-nums}
.receipt{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 0 14px;overflow:hidden}
.place{display:block;width:calc(100% - 28px);margin:0 14px 6px;border:0;border-bottom:1px dashed var(--line);background:transparent;font-family:var(--display);font-size:20px;padding:4px 0 8px;outline:none}
.hint{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);padding:4px 14px 6px}
.hint .l{color:#1f7a6c}.hint .r{color:#c8681c}
ul.items{list-style:none}
li.item{position:relative;overflow:hidden;border-bottom:1px dotted var(--line)}
.under{pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;padding:0 20px;font-weight:700;color:#fff;opacity:0}
.under.toW{background:#c8681c;justify-content:flex-start;opacity:1}.under.toU{background:#1f7a6c;justify-content:flex-end;opacity:1}
.face{position:relative;background:var(--card);padding:12px 14px;display:flex;align-items:center;gap:10px;touch-action:pan-y;transition:transform .2s;cursor:pointer;user-select:none;-webkit-user-select:none}
.face.dragging{transition:none}
.mark{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line)}
.item[data-side="us"] .mark{background:#1f7a6c;border-color:#1f7a6c}.item[data-side="wass"] .mark{background:#c8681c;border-color:#c8681c}
.item[data-side="shared"] .mark{background:linear-gradient(90deg,#1f7a6c var(--u,67%),#c8681c 0);border-color:transparent}
.iname{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:500;font-size:14px}
.iname .l1,.iname .orig{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iname .orig{font-size:12px;color:var(--muted);font-style:italic;font-weight:400}
.item[data-side=""] .iname{font-weight:700}
.qty{color:var(--muted);font-size:12px;margin-right:4px}
.item .who{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.item[data-side="us"] .who{color:#1f7a6c}.item[data-side="wass"] .who{color:#c8681c}.item[data-side="shared"] .who{color:#5b5f9e}
.item .amt{flex:none;font-weight:700;font-variant-numeric:tabular-nums;min-width:4.6em;text-align:right}
.tray{padding:2px 14px 14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.tray .chip{padding:5px 11px;font-size:13px}
.extras{display:flex;flex-wrap:wrap;gap:14px;border-top:1px dashed var(--line);padding-top:6px}
.link.danger{color:#a63a3a}
.rfoot{padding:10px 14px 0;display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
.rfoot div{display:flex;justify-content:space-between;gap:10px}
.rfoot .tot{font-weight:800;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:11px 12px;font-weight:700;text-align:left;cursor:pointer;font-size:14px}
.choice button small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.choice button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice button.u.on{border-color:#1f7a6c;box-shadow:inset 0 0 0 1px #1f7a6c}.choice button.w.on{border-color:#c8681c;box-shadow:inset 0 0 0 1px #c8681c}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.side{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:12px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.side h3{font-size:17px;margin-bottom:2px}.side.u h3{color:#1f7a6c}.side.w h3{color:#c8681c}
.side .ln{display:flex;justify-content:space-between;color:var(--muted)}.side .ln b{color:var(--ink);font-weight:600}
.side .big{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:800}
.verdict{margin-top:14px;border-radius:20px;padding:18px;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:4px}
.verdict .vwho{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.verdict .vamt{font-family:var(--display);font-size:34px;line-height:1.05}
.verdict .vsub{font-size:13px;opacity:.85}
.verdict.pending{background:var(--card);color:var(--muted);border:1.5px dashed #d6d0c7}
.verdict.pending .vamt{font-size:20px;color:var(--ink)}
pre.sql{max-width:100%;background:#1d2229;color:#f5f3ef;border-radius:14px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre;margin-top:8px}
.spotpin{display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateY(8px)}
.spotpin i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.spotpin span{background:#fff;color:var(--ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;box-shadow:0 1px 5px rgba(0,0,0,.2);white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.upd{position:fixed;left:12px;right:12px;margin:0 auto;max-width:456px;top:calc(10px + env(safe-area-inset-top));z-index:20;background:var(--ink);color:#fff;border-radius:18px;padding:10px 12px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.upd .btn{padding:8px 16px;font-size:14px}
.mealph{margin-top:16px}
.mealph img{width:100%;max-height:260px;object-fit:cover;border-radius:18px;box-shadow:var(--shadow);cursor:zoom-in;display:block}
.mealph.big img{max-height:none;object-fit:contain;cursor:zoom-out}
.mdot{width:10px;height:10px;border-radius:50%;flex:none}.mdot.u{background:#1f7a6c}.mdot.w{background:#c8681c}.mdot.s{background:#5b5f9e}
/* everyone picks */
.gwho{padding:6px 14px 10px;display:flex;flex-direction:column;gap:6px;border-bottom:1px dashed var(--line)}
.gwho .chip{padding:6px 12px;font-size:13px}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;flex:none}
li.gitem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px dotted var(--line)}
li.gitem.mine{background:var(--accent-soft)}
.ginfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.ginfo .l1{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.ginfo .orig{font-size:12px;color:var(--muted);font-style:italic}
.gtags{display:flex;flex-wrap:wrap;gap:4px}
.gtag{font-size:11px;font-weight:700;border-radius:99px;padding:1px 8px;background:#f1ede6;color:var(--c,#555)}
li.gitem .amt{flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.gbtn{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-weight:700;font-size:13px;min-width:80px;cursor:pointer;color:var(--ink)}
.gbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.gstep{flex:none;display:flex;align-items:center;gap:4px}
.gstep button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.gstep button:disabled{opacity:.35}
.gstep span{min-width:1.4em;text-align:center;font-weight:800}
.gprog{margin-top:12px}
.gpl{display:flex;flex-direction:column;gap:6px;font-size:14px;margin-bottom:10px}
.gpl span{color:var(--muted)}.gpl span.ok{color:var(--ink);font-weight:700}
.gsplit{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.gsplit .gp{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;font-size:14px}
.gsplit .gp b.t{font-variant-numeric:tabular-nums;font-size:16px}
.vline{display:flex;justify-content:space-between;gap:10px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.payrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.paybtn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;text-decoration:none;cursor:pointer;font-family:inherit}
.paybtn.ghost{background:transparent}
.verdict .paybtn{border-color:transparent}
.verdict .paybtn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}
.setl{padding:12px 0 2px;border-top:1px solid var(--line);margin-top:10px}
.setl .vline{font-size:16px}

function isoOf(d){

/* ================= opening hours ================= */
function weekly(periods){
  if(!periods) return null;
  return periods.map(p=>{
    if(!p.close) return [0,20160];
    const s=p.open.day*1440+p.open.hour*60+p.open.minute;
    let e=p.close.day*1440+p.close.hour*60+p.close.minute; if(e<=s) e+=10080; return [s,e];
  });
}
function hoursFor(p,D){
  if(p.cur&&p.curFrom){const k=dayDiff(p.curFrom,D);if(k>=0&&k<7) return {w:p.cur,src:'current',special:(p.special||[]).includes(D)}}
  if(p.reg) return {w:p.reg,src:'regular',special:false};
  return null;
}
function dayRanges(w,dow){
  const a=dow*1440,b=a+1440,out=[];
  for(const[s,e]of w){
    if(e-s>=10080){out.push([0,1440]);continue}
    for(const off of [0,10080,-10080]){const ss=s+off,ee=e+off;if(ss<b&&ee>a&&ss>=a-1440) out.push([Math.max(ss,a)-a,Math.min(ee,b+600)-a])}
  }
  const seen=new Set();return out.filter(([s,e])=>{const k=s+'-'+e;if(seen.has(k)||s>=1440||s<0)return false;seen.add(k);return true}).sort((x,y)=>x[0]-y[0]);
}
const holidayOn=D=>data.holidays.find(h=>h.date===D);
// returns {s, big, small, txt}
function status(p,D,m){
  if(!D){({date:D,min:m}=when())}
  if((p.closedOn||[]).includes(D)) return {s:'closed',big:'Closed',small:'your note',txt:'Closed (your note)'};
  if(p.biz==='CLOSED_PERMANENTLY') return {s:'closed',big:'Closed',small:'permanently',txt:'Permanently closed'};
  if(p.biz==='CLOSED_TEMPORARILY') return {s:'closed',big:'Closed',small:'temporarily',txt:'Temporarily closed'};
  const h=hoursFor(p,D);
  if(!h) return {s:'unknown',big:'Hours',small:p.gid?'not listed':'not loaded',txt:p.gid?'No hours on Google':(data.key?(p.linkFailed?'Not found on Google':'Hours loading…'):'Hours need Google')};
  const t=dowOf(D)*1440+m;
  for(const[s,e]of h.w) for(const tt of [t,t+10080]) if(tt>=s&&tt<e){const all=e-s>=10080;return {s:'open',left:e-tt,big:'Open',small:all?'24 hours':`until ${fmt(e)}`,txt:all?'Open 24 hours':`Open until ${fmt(e)}`,h}}
  const dayEnd=(dowOf(D)+1)*1440; let next=null;
  for(const[s]of h.w) if(s>t&&s<dayEnd&&(next===null||s<next)) next=s;
  if(next!==null) return {s:'soon',wait:next-t,big:'Opens',small:`at ${fmt(next)}`,txt:`Opens at ${fmt(next)}`,h};
  const any=dayRanges(h.w,dowOf(D)).length;
  return {s:'closed',big:'Closed',small:any?'for the day':'all day',txt:any?'Closed for the day':'Closed all day',h};
}
function flagsFor(p,D){
  const hol=holidayOn(D), h=hoursFor(p,D);
  if(h&&h.special) return `<span class="flag ok">✓ ${hol?'Holiday':'Special'} hours confirmed</span>`;
  if(hol&&p.gid&&h&&h.src==='current') return `<span class="flag ok">✓ Checked for ${esc(hol.name)}</span>`;
  if(hol) return `<span class="flag warn">Holiday · call ahead</span>`;
  return '';
}

function matches(p){

  ['Any venue',...p.tags].forEach(c=>(data.prefs[c]||[]).forEach(pref=>{
    const k=pref.toLowerCase().trim(); if(!k||seen.has(k)) return;
    let hit=(p.menu||[]).find(x=>x.toLowerCase().includes(k))||(hay.includes(k)||p.tags.some(t=>t.toLowerCase()===k)?pref:null);

    if(hit){seen.add(k);out.push(hit)}
  }));
  return out;
}

let gPromise=null;
function gmaps(){
  if(gPromise) return gPromise;
  if(!data.key) return Promise.reject(new Error('No Google key yet. Add one in Settings.'));
  gPromise=new Promise((res,rej)=>{
    window.__gmInit=async()=>{try{
      const [pl,mp,mk]=await Promise.all([window.google.maps.importLibrary('places'),window.google.maps.importLibrary('maps'),window.google.maps.importLibrary('marker')]);
      window.__IMT=mp.ImageMapType;state.keyStatus='ok';res({Place:pl.Place,Map:mp.Map,Marker:mk.AdvancedMarkerElement,Pin:mk.PinElement});
    }catch(e){state.keyStatus='bad';rej(e)}};
    window.gm_authFailure=()=>{state.keyStatus='bad';toast('Google rejected the API key. Check it in Settings.');renderSoft()};
    const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(data.key)}&v=weekly&loading=async&callback=__gmInit&language=en&region=ES`;
    s.async=true;s.onerror=()=>{state.keyStatus='bad';rej(new Error('Couldn’t reach Google. Are you online?'))};
    document.head.append(s);
  });
  gPromise.catch(()=>renderSoft());

}

// Turn Google's photo link into a direct image address once, so showing it again costs nothing
const photoWanted=p=>!!p&&!p.disc&&(wantTo(p)||!!p.photoAsk);
async function resolvePhoto(p,force){
  if(!p.photo||p.photo.resolved||p.photo.tried||!data.key||data.showPhotos===false) return false;
  if(!force&&!photoWanted(p)) return false;
  p.photo.tried=true;
  try{
    const u=new URL(p.photo.src);
    if(u.hostname==='places.googleapis.com'){
      u.searchParams.set('skipHttpRedirect','true'); if(!u.searchParams.get('key')) u.searchParams.set('key',data.key);
      const j=await (await fetch(u.toString())).json();
      if(j.photoUri){p.photo.src=j.photoUri;p.photo.resolved=true;p.photoAt=Date.now();delete p.photo.tried;save();return true}
    }else{p.photo.resolved=true;p.photoAt=Date.now();delete p.photo.tried;save();return true}
  }catch(e){console.warn('photo',e)}
  return false;
}
let syncing=false;
async function syncAll(force){
  if(!data.key||syncing) return; syncing=true;
  const today=madridNow().date;
  if(force) data.places.forEach(p=>p.linkFailed=false);
  const todo=data.places.filter(p=>force||!p.gid||!p.updated).filter(p=>force||!p.linkFailed);
  let i=0,ok=0;
  for(const p of todo){
    i++; state.sync=`Updating from Google… ${i} of ${todo.length}`; renderSync();
    try{
      if(!p.gid){const r=await gSearch(p.query||`${p.name}, Xàbia`,1);if(!r.length){p.linkFailed=true;state.lastErr=`Google found no match for “${p.name}”`;continue}p.gid=r[0].gid}
      applyDetails(p,await gDetails(p.gid)); await resolvePhoto(p); save(); ok++;
    }catch(e){console.warn(p.name,e);state.lastErr=String(e&&e.message||e);if(state.keyStatus==='bad')break}
  }
  syncing=false; state.sync=state.keyStatus==='bad'?'':(todo.length?`Updated ${ok} of ${todo.length} places from Google`+(ok===0&&state.lastErr?` — Google said: ${state.lastErr}`:''):''); save(); renderSoft();
  if(!(ok===0&&state.lastErr)) setTimeout(()=>{state.sync='';renderSync()},4000);
}

const NOUN_SYN={croissant:['croissant','cruas','croisant'],coffee:['coffee','café','cafe','cortado','espresso'],churro:['churro'],ensaimada:['ensaimada'],paella:['paella','arroz','rice'],rice:['arroz','rice','paella'],tapas:['tapa'],gelato:['gelat','helad','ice cream'],'ice cream':['ice cream','helad','gelat'],cocktail:['cocktail','cóctel','coctel'],wine:['wine','vino'],beer:['beer','cerveza','caña']};
function prefNouns(tags){const out=new Map();
  ['Any venue',...tags].forEach(c=>(data.prefs[c]||[]).forEach(pref=>{const w=pref.toLowerCase().trim().replace(/s$/,'');if(!w)return;
    const noun=Object.keys(NOUN_SYN).find(k=>w.endsWith(k))||w.split(/\s+/).pop();if(!out.has(noun))out.set(noun,[]);out.get(noun).push(pref)}));
  return out}
// Does Google's info (serves flags, summary, recent reviews) show this place has each thing we want?
function prefOK(p,tags){const dt=data.diet||[];if((dt.includes('Vegetarian')||dt.includes('Vegan'))&&p.serves&&p.serves.vegetarian===false)return false;
  const need=prefNouns(tags);if(!need.size)return true;const t=(p.rv||'')+' '+String(p.name||'').toLowerCase()+' '+String(p.type||'').toLowerCase();
  for(const [noun] of need){const syn=NOUN_SYN[noun]||[noun];
    const flag=GOOGLE_KW.find(([re])=>re.test(noun));if(flag&&!(p.serves&&p.serves[flag[1]]===false))continue; // Google's own flag (coffee, wine…): fine unless Google says no
    if(!syn.some(x=>t.includes(x)))return false}
  return true}

function score(p){

}

}

// Work out what was pasted: a Maps link (short or full), a shared message, or just a name
function parseMapsUrl(u){
  const out={};
  try{u=decodeURIComponent(u.replace(/\+/g,' '))}catch(e){}
  let m=u.match(/\/maps\/place\/([^/@?]+)/); if(m) out.name=m[1].trim();
  m=u.match(/[?&](?:query_place_id|place_id)=([A-Za-z0-9_-]{10,})/); if(m) out.gid=m[1];
  m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/); if(m){out.lat=+m[1];out.lng=+m[2]}
  if(!out.name){m=u.match(/[?&](?:q|query)=([^&]+)/); if(m&&!/^-?\d+\.\d+,\s*-?\d+\.\d+$/.test(m[1].trim())) out.name=m[1].trim()}
  return out;
}
async function resolveShort(u){

}
async function smartAdd(text,relinkId){
  text=String(text||'').trim(); if(!text) return;

  const url=(text.match(/https?:\/\/\S+/)||[])[0], words=text.replace(/https?:\/\/\S+/g,' ').replace(/\s+/g,' ').trim();
  if(!url) return doSearch(text);
  state.addBusy='Reading the link…'; state.addResults=null; render(true);
  let info={}, full=url;
  try{
    if(/maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs/i.test(url)) full=await resolveShort(url);
    info=parseMapsUrl(full);
  }catch(e){
    state.addBusy=false;
    if(words.length>=3) return doSearch(words);
    state.addMsgWarn=true;
    state.addMsg=e.message==='nosb'?'Short Google links need sync turned on (Settings → Sync &amp; sharing). For now, type the business name instead.'
      :e.message==='noresolve'||/resolve_link|function|404|Could not find/i.test(e.message)?'To read short Google links, run the updated SQL in Supabase once (Settings → Sync &amp; sharing → Copy the SQL). For now, type the business name instead.'
      :'Couldn’t read that link. Type the business name instead.';
    return render(true);
  }

      const q=info.name||words; if(!q){state.addBusy=false;state.addMsgWarn=true;state.addMsg='That link doesn’t name a business. Open the business in Google Maps and share it from there, or type its name.';return render(true)}
      const g=await gmaps();
      const req={textQuery:q,fields:SEARCH_FIELDS,maxResultCount:5,language:'en',region:'es',locationBias:info.lat!=null?{center:{lat:info.lat,lng:info.lng},radius:300}:{center:HOME,radius:9000}};
      const {places}=await g.Place.searchByText(req);
      const res=(places||[]).map(x=>({gid:x.id,name:x.displayName,addr:x.formattedAddress,type:x.primaryTypeDisplayName,lat:x.location&&x.location.lat(),lng:x.location&&x.location.lng()}));
      if(!res.length){state.addBusy=false;state.addMsgWarn=true;state.addMsg=`Google couldn’t find “${esc(q)}”. Try typing the name a different way.`;return render(true)}
      // with a position from the link, the nearest match is the business you shared
      if(info.lat!=null) res.sort((a,b)=>km(info,a)-km(info,b));

    if(ex){state.addBusy=false;toast(`${ex.name} is already in your places`);state.stack.pop();state.stack.push('detail:'+ex.id);return render()}

function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=u})}

const J=x=>JSON.stringify(x);
const isObj=x=>x&&typeof x==='object'&&!Array.isArray(x);
const keyOf=x=>isObj(x)?x.id:typeof x==='string'||typeof x==='number'?'v:'+x:undefined;
const idArr=a=>Array.isArray(a)&&a.every(x=>keyOf(x)!==undefined);
function m3(b,l,r){
  if(J(l)===J(r)) return l;
  if(b!==undefined){if(J(l)===J(b)) return r; if(J(r)===J(b)) return l}
  else{if(l===undefined) return r; if(r===undefined) return l}

    const bm=new Map((b||[]).map(x=>[keyOf(x),x])),lm=new Map(l.map(x=>[keyOf(x),x])),rm=new Map(r.map(x=>[keyOf(x),x]));
    const order=[...r.map(keyOf),...l.map(keyOf).filter(k=>!rm.has(k))], out=[];
    for(const k of order){const inB=bm.has(k),inL=lm.has(k),inR=rm.has(k);
      if(inB&&(!inL||!inR)) continue;          // removed on one phone
      out.push(inL&&inR?m3(bm.get(k),lm.get(k),rm.get(k)):inL?lm.get(k):rm.get(k))}

function mergeApp(local,remote){

  if(!remote.key&&local.key) out.key=local.key;
  return out;
}

      ['https://open.er-api.com/v6/latest/EUR',j=>[j.rates&&j.rates.GBP,(j.time_last_update_utc||'').slice(5,16)]]];

function settleLines(){
  const pr={},add=(f,t,v)=>{if(!f||!t||f===t||!v)return;const k=f<t?f+'|'+t:t+'|'+f;pr[k]=(pr[k]||0)+(f<t?v:-v)};

const BILL_PROMPT=`This photo is a restaurant bill or receipt, probably in Spanish. Extract every ordered line item.

- "total" is the LINE total as printed (qty × unit price), a number with no currency sign.
- Exclude subtotal, tax/IVA summary, total, payment, change and card lines.
- Cover or bread charges (pan, cubierto) are items.
- Do NOT list a service charge or tip (servicio, propina, service, gratuity) as an item. Instead set "serviceIncluded" true, "serviceAmount" to its amount, and "serviceNote" to the printed wording.

const IG_RE=/^[a-z0-9._]{2,30}$/i;
function parseIg(text){
  const t=String(text||'');
  let j=null;try{j=JSON.parse((t.match(/\{[\s\S]*\}/)||[''])[0])}catch(e){}
  let h=j&&j.handle!=null?String(j.handle):'', conf=j&&j.confidence?String(j.confidence).toLowerCase():'';
  if(!h){const m=t.match(/instagram\.com\/([a-z0-9._]{2,30})/i)||t.match(/(?:^|\s)@([a-z0-9._]{3,30})\b/i);if(m){h=m[1];conf=conf||'medium'}}
  h=h.replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/[\/?#].*$/,'').trim();
  if(!IG_RE.test(h)||/^(explore|p|reel|reels|stories|accounts|about)$/i.test(h)) return null;
  return {handle:h,conf:conf||'low'};
}

  const others=P.filter(p=>p.id!=='us').map(p=>p.name).join(' & ')||NM().b;

  return `${subbar('Settings','pop()')}

    <div class="frow"><input class="field" id="claudeUrl" name="c" placeholder="https://claude.ai/project/…" value="${esc(data.claudeUrl||'')}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Link to your Claude project"><button class="btn">Save</button></div>
    ${data.places.some(p=>!p.ig&&!p.disc)?(data.claudeUrl?`<a class="btn ghost block" href="${esc(data.claudeUrl)}" target="_blank" rel="noopener" onclick="askClaudeIg(true)" style="text-decoration:none;text-align:center">Ask Claude for missing Instagrams (${data.places.filter(p=>!p.ig&&!p.disc).length})</a>`:''):''}

    <div class="srow"><span>Reading bill photos</span><span class="ks ${billOK?'ok':'none'}">${billOK?'On':'Not set'}</span></div>

    ${aiUsageHtml()}
    <div class="srow"><label for="dscT">Suggest top-rated places we haven’t added</label><input type="checkbox" id="dscT" ${data.discover?'checked':''} onchange="data.discover=this.checked;save()"></div>
    <div class="srow"><label for="phT">Google photos for places we want to go to<br><span class="small">Other places have a Show photo button</span></label><input type="checkbox" id="phT" ${data.showPhotos!==false?'checked':''} onchange="data.showPhotos=this.checked;save()"></div>

      <form onsubmit="event.preventDefault();saveKey(this.k.value)"><label class="lab" for="keyBox">Google Maps key</label>
        <div class="frow" style="margin-top:0"><input class="field" name="k" id="keyBox" type="password" autocomplete="off" placeholder="Starts AIza…" value="${esc(data.key)}"><button class="btn">Save</button></div></form>
      <form onsubmit="event.preventDefault();saveGemKey(this.g.value)"><label class="lab" for="gemKeyIn">Bill-reading key (from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>)</label>
        <div class="frow" style="margin-top:0"><input class="field" id="gemKeyIn" name="g" placeholder="${billOK?'Saved · paste a new one to replace':'Paste the key'}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn">Save</button></div>

function copyTransfer(){
  const pack={d:{...data},bill:B.bill,meals:B.meals};
  const code='XE1.'+btoa(unescape(encodeURIComponent(JSON.stringify(pack))));
  copyText(code,'Transfer code copied. Open the app on the other screen and paste it in Settings.');
}
function pasteTransfer(code){
  try{
    code=code.trim().replace(/\s/g,'');if(!code.startsWith('XE1.'))throw 0;
    const pack=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));
    if(!pack.d||!Array.isArray(pack.d.places))throw 0;
    data=Object.assign(defaultData(),pack.d);save();
    if(pack.bill){B.bill=pack.bill;B.meals=pack.meals||B.meals;localBills()}
    toast('Everything moved across. Reloading…');setTimeout(()=>location.reload(),900);
  }catch(e){toast('That isn’t a full transfer code. Copy it again and paste the whole thing.')}
}
function removeStarters(){
  if(state.confirmDel!=='SEEDS'){state.confirmDel='SEEDS';render(true);setTimeout(()=>{if(state.confirmDel==='SEEDS'){state.confirmDel=null;renderSoft()}},4000);return}
  const before=data.places.length;data.places=data.places.filter(p=>!p.seed||p.touched||data.plan.includes(p.id));state.confirmDel=null;save();
  toast(`Removed ${before-data.places.length} starter places`);render(true);
}
function saveKey(k){k=k.trim();if(k===data.key){toast('Key unchanged');return}data.key=k;save();toast(k?'Key saved. Reloading…':'Key removed');setTimeout(()=>location.reload(),600)}
function addHol(f){if(!f.d.value)return;data.holidays.push({date:f.d.value,name:f.n.value.trim()||'Holiday'});save();render(true)}
function rmHol(d){const i=data.holidays.findIndex(h=>h.date===d);if(i>=0)data.holidays.splice(i,1);save();render(true)}
function resetAll(){
  if(state.confirmDel!=='ALL'){state.confirmDel='ALL';render(true);return}
  const key=data.key;data=defaultData();data.key=key;state.confirmDel=null;save();toast('Starter list restored');render();syncAll();
}

/* ================= nav & render ================= */
function saveDisc(id){
  const d=byId(id); if(!d||!d.disc) return id;
  const ex=data.places.find(p=>p.gid===d.gid); if(ex) return ex.id;
  const p=JSON.parse(JSON.stringify(d)); p.id=uid(); delete p.disc; data.places.push(p); save();
  const top=state.stack.at(-1); if(top==='detail:'+id) state.stack[state.stack.length-1]='detail:'+p.id;
  return p.id;
}
function savePlace(id){const nid=saveDisc(id);toast(`${byId(nid).name} saved to your places`);render(true)}
function togglePlan(id){
  if(byId(id)?.disc) id=saveDisc(id);
  const i=data.plan.indexOf(id), p=byId(id);
  if(i>=0){data.plan.splice(i,1);data.done=data.done.filter(x=>x!==id);toast('Removed from your plan')}else{data.plan.push(id);toast(`${p.name} added to your plan`);setTimeout(wantPhotos,50)}
  save(); render(true);
}
let toastT;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000)}
function push(s){state.confirmDel=null;state.stack.push(s);render()}
function pop(){state.confirmDel=null;state.stack.pop();render()}
function openDetail(id){push('detail:'+id)}

const TABS=[['today','Home',I.home],['saved','Saved',I.heart],['plan','Plan',I.route],['map','Map',I.map],['bills','Bills',I.receipt]];
function renderTabs(){
  const top=state.stack.at(-1), hide=top&&top.startsWith('detail:');
  document.getElementById('phone').classList.toggle('detail',!!hide);
  const t=document.getElementById('tabs'); t.hidden=!!hide; if(hide) return;
  t.innerHTML=TABS.map(([k,l,ic])=>{const on=state.tab===k&&!state.stack.length;
    return k==='plan'?`<button class="tab mid ${on?'on':''}" onclick="go('plan')" aria-label="Plan"><i>${ic}</i>${l}${(()=>{const t=TPr().ids.filter(byId).length,pl=data.plan.filter(byId).length;return t||pl?`<em class="badge">${t||pl}</em>`:''})()}</button>`
      :`<button class="tab ${on?'on':''}" onclick="go('${k}')">${ic}${l}${k==='bills'&&needsMyPick()?'<em class="bdot" aria-label="Your picks are needed"></em>':''}</button>`}).join('');
}
function go(k){if(k==='bills'&&state.tab==='bills'&&!state.stack.length)state.billStep=0;state.tab=k;state.stack=[];state.confirmDel=null;render()}
function renderTripBar(){let bar=document.getElementById('tripbar');if(!state.betterTrip){if(bar)bar.hidden=true;return}
  if(!bar){bar=document.createElement('div');bar.id='tripbar';bar.className='upd';document.body.append(bar)}
  bar.hidden=false;bar.innerHTML=`<span>Your trip is saved separately</span><button class="btn" onclick="switchTrip('${state.betterTrip.trip}')">Switch</button>`}
function renderSync(){const el=document.getElementById('sync');if(el)el.textContent=state.sync}
// re-render after background work, but never while someone is typing
function renderSoft(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return renderSync();if(['billsetup','settings','spot','add','prefs'].includes(state.stack.at(-1))||String(state.stack.at(-1)).startsWith('relink'))return renderSync();if(state.tab==='map'&&!state.stack.length)return renderSync();render(true)}
function render(keepScroll){
  const app=document.getElementById('app'), top=state.stack.at(-1);
  let html;
  if(top==='add') html=screenAdd();
  else if(top==='settings') html=screenSettings();
  else if(top==='spot') html=screenSpot();
  else if(top&&top.startsWith('relink:')) html=screenAdd(top.slice(7));
  else if(top&&top.startsWith('detail:')) html=screenDetail(top.slice(7));
  else if(top==='prefs') html=screenPrefs();
  else if(top==='trip') html=screenTrip();
  else if(top==='billsetup') html=screenBillSetup();
  else if(top&&top.startsWith('meal:')) html=screenMeal(top.slice(5));
  else if(top&&top.startsWith('outing:')) html=screenOuting(top.slice(7));
  else if(top&&top.startsWith('home:')) html=showHomes()?screenHome(top.slice(5)):subbar('Home','pop()');
  else html={today:screenToday,saved:screenSaved,map:screenMap,plan:screenPlan,bills:screenBills,prefs:screenPrefs}[state.tab]();
  const af=document.activeElement, fid=af&&af.id, pos=fid&&af.selectionStart!=null?af.selectionStart:null, y=window.scrollY;
  const rails=[...document.querySelectorAll('.rail')].map(r=>r.scrollLeft);
  app.innerHTML=html;
  document.querySelectorAll('.rail').forEach((r,i)=>{if(keepScroll&&rails[i])r.scrollLeft=rails[i]});
  if(!top&&state.tab==='today') {renderList();document.querySelectorAll('.rail').forEach((r,i)=>{if(keepScroll&&rails[i])r.scrollLeft=rails[i]})}
  if(!top&&state.tab==='map') drawMap();
  if(top==='spot') drawSpotMap();
  if(!top&&state.tab==='bills'){renderBillsBody();pullBills()}
  if(top&&top.startsWith('meal:')) loadMealPhoto(top.slice(5));
  if(document.getElementById('bvrBuy'))bvrUpdate();
  if(top&&top.startsWith('home:')){const hm=document.getElementById('hmap');if(hm)drawHomeMap(hm,top.slice(5))}
  if(state.risk&&document.getElementById('riskLeg'))riskLegHtml(state.risk).then(h=>{const l=document.getElementById('riskLeg');if(l)l.innerHTML=h});
  if(top&&top.startsWith('outing:')){swipeRows();const om=document.getElementById('omap'),oo=outById(top.slice(7));if(om&&oo)drawRoute(om,oo)}
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(pos!=null&&el.setSelectionRange)try{el.setSelectionRange(pos,pos)}catch(e){}}}
  window.scrollTo(0,keepScroll?y:0);
  renderTabs();
}
// Check for a newer version each time the app opens, and offer a one-tap update (nothing is reset)
async function checkUpdate(){
  try{
    const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const m=(await r.text()).match(/const APP_VERSION='(v\d+)'/); if(!m||m[1]===APP_VERSION) return;
    if(+m[1].slice(1)<=+APP_VERSION.slice(1)) return;
    let bar=document.getElementById('upd'); if(!bar){bar=document.createElement('div');bar.id='upd';bar.className='upd';document.body.append(bar)}
    bar.innerHTML=`<span>A new version (${m[1]}) is ready.</span><button class="btn" onclick="location.replace(location.pathname+'?v=${m[1]}')">Update</button>`;
  }catch(e){}
}
setTimeout(checkUpdate,1500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
render();
if(data.key) gmaps().then(()=>{renderSoft();syncAll()}).catch(()=>{});
setInterval(()=>{if(!state.when&&!state.stack.length&&state.tab==='today'){const t=document.getElementById('tm');if(t)t.textContent=fmt(madridNow().min);renderList()}},60000);
