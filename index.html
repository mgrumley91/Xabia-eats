<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xàbia Eats">
<meta name="theme-color" content="#f5f3ef">
<title>Xàbia Eats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: travel-app feed — photo cards on a warm off-white ground, serif titles, one terracotta accent, bottom bar with a round centre button */
:root{
  --bg:#f5f3ef; --card:#ffffff; --ink:#1d2229; --muted:#838891; --line:#ebe7e1;
  --accent:#d4622e; --accent-dark:#b94f1f; --accent-soft:#fbeadf;
  --open:#2c8553; --soon:#c0771a; --closed:#979ca3; --mich:#b8333a; --warn-bg:#fdf1dc; --warn:#8a5a0c;
  --display:'DM Serif Display',Georgia,'Times New Roman',serif;
  --body:Manrope,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px; --shadow:0 6px 22px rgba(40,30,20,.08);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.phone{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
.phone.detail{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.pad{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:6px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em}
.brand i{color:var(--accent);font-style:italic}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.hello{padding-top:10px}
.hello p{color:var(--muted);font-size:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.005em;text-wrap:balance}
.hello h1{font-size:32px;line-height:1.1;margin-top:2px}
.pagetitle{font-size:30px;line-height:1.1;padding-top:6px}
.lead{color:var(--muted);font-size:14px;margin-top:4px}

.search{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;padding:13px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;text-align:left}
.search svg{width:18px;height:18px;flex:none}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}

.when{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px 8px}
.when .r{display:flex;align-items:center;gap:8px}
.when svg{width:18px;height:18px;color:var(--accent);flex:none}
.when select{border:0;background:transparent;font-weight:600;cursor:pointer;max-width:55%}
.when .t{font-weight:600;font-variant-numeric:tabular-nums}
.when .now{margin-left:auto;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600;cursor:pointer}
.when .now.on{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent);margin-top:4px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:14px max(18px,env(safe-area-inset-right)) 4px max(18px,env(safe-area-inset-left));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 15px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.x{padding-right:8px;display:inline-flex;align-items:center;gap:4px;cursor:default}
.chip.x button{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;cursor:pointer;padding:0 4px}

.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:12px 4px 10px;cursor:pointer;font-size:12px;font-weight:600;line-height:1.2;text-align:center}
.cat i{font-style:normal;font-size:24px;width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.cat.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cat.on i{background:rgba(255,255,255,.22)}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toggles .chip{font-size:13px;padding:6px 13px}
#recmap{height:260px;border-radius:var(--r);overflow:hidden;background:var(--line);box-shadow:var(--shadow);margin-top:16px}
.lg::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg.pick::before{background:var(--accent)}.lg.wait::before{background:var(--soon)}
.hero-card{width:100%;max-width:none;cursor:pointer}
.hero-card .ph{height:190px}
.hero-card.pick{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.hero-card.wait{box-shadow:0 0 0 2px #e3b46f,var(--shadow)}
.hero-card.wait .ph{height:140px}
.pickbadge{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 11px}
.pickbadge svg{width:13px;height:13px}
.pickbadge.wait{background:var(--warn-bg);color:var(--warn)}
.why{font-size:13px;color:#4b5059}
.newtag{font-size:11px;font-weight:700;color:#2f6f86;background:#e2eef3;border-radius:6px;padding:1px 6px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-top:24px;margin-bottom:12px}
.sec h2{font-size:23px}
.sec span{color:var(--muted);font-size:13px}

/* big photo cards in a horizontal rail */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left));scroll-padding:0 18px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:none;width:78%;max-width:340px;scroll-snap-align:start;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.rail .card:only-child{width:100%;max-width:none}
.ph{position:relative;height:170px;margin:8px 8px 0;border-radius:16px;overflow:hidden}
.ph img,.noph{width:100%;height:100%;object-fit:cover;display:block}
.noph{display:grid;place-items:center;background:linear-gradient(135deg,var(--t1),var(--t2));color:rgba(29,34,41,.55);font-family:var(--display);font-size:46px}
.loc{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:5px;background:rgba(29,34,41,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-size:12px;font-weight:600;padding:5px 10px 5px 8px;border-radius:99px}
.loc svg{width:13px;height:13px}
.fav{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.fav svg{width:18px;height:18px}
.fav.on{background:var(--accent);color:#fff}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.ct{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ct h3{font-size:20px;line-height:1.15;min-width:0;overflow-wrap:anywhere}
.stat{text-align:right;flex:none;line-height:1.15}
.stat b{display:block;font-size:14px}
.stat small{color:var(--muted);font-size:12px}
.s-open b,.s-open .dotc{color:var(--open)}.s-soon b,.s-soon .dotc{color:var(--soon)}.s-closed b,.s-unknown b{color:var(--closed)}
.facts{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px;align-items:center}
.facts span{display:inline-flex;align-items:center;gap:4px}
.facts svg{width:14px;height:14px}
.star{color:#e0a526}
.match{color:var(--accent-dark);font-size:13px;font-weight:600}
.mich{display:inline-flex;align-items:center;gap:3px;background:var(--mich);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;letter-spacing:.01em}
.flag{display:inline-block;font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px}
.flag.ok{background:#e3f1e8;color:var(--open)}.flag.warn{background:var(--warn-bg);color:var(--warn)}

/* compact rows */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}
.thumb{width:58px;height:58px;border-radius:14px;overflow:hidden;flex:none}
.thumb img,.thumb .noph{width:100%;height:100%;object-fit:cover;font-size:24px}
.grow{flex:1;min-width:0}
.rname{font-family:var(--display);font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.rmeta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;margin-top:2px}
.dotc::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
.s-closed .dotc,.s-unknown .dotc{color:var(--closed)}
.add{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.add svg{width:17px;height:17px}
.add.on{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:14px}

.note{border-radius:18px;padding:14px 16px;margin-top:14px;font-size:14px;line-height:1.45;background:var(--accent-soft)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note b{font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;background:var(--accent);color:#fff;font-weight:700;padding:13px 22px;cursor:pointer;text-decoration:none;font-size:15px}
.btn svg{width:18px;height:18px}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:#a63a3a;border:1px solid var(--line)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.4;pointer-events:none}
.link{background:none;border:0;color:var(--accent-dark);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:none}

/* detail */
.hero{position:relative;height:340px;background:var(--line)}
.gal{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:none;width:100%;height:100%;scroll-snap-align:start;position:relative}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal .noph{font-size:90px}
.credit{position:absolute;left:12px;bottom:34px;color:#fff;font-size:11px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.credit a{color:#fff}
.round{position:absolute;top:calc(14px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.round svg{width:20px;height:20px}
.round.l{left:max(16px,env(safe-area-inset-left))}.round.r{right:max(16px,env(safe-area-inset-right))}
.round.r2{right:calc(max(16px,env(safe-area-inset-right)) + 54px)}
.round.on{background:var(--accent);color:#fff}
.dots{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:5px}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55)}
.dots i.on{background:#fff;width:16px;border-radius:4px}
.sheet{position:relative;margin-top:-22px;background:var(--bg);border-radius:26px 26px 0 0;padding-top:22px}
.kicker{display:inline-flex;align-items:center;gap:5px;color:var(--accent-dark);font-size:13px;font-weight:600}
.kicker svg{width:14px;height:14px}
.dtitle{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:6px}
.dtitle h1{font-size:30px;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.dtitle .stat b{font-size:16px}
.desc{color:#4b5059;margin-top:12px;font-size:15px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px;padding:16px 6px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.feat a,.feat button{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;font-size:12px;font-weight:600;background:none;border:0;cursor:pointer;text-align:center}
.feat i{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);display:grid;place-items:center}
.feat svg{width:21px;height:21px}
.feat .off{opacity:.3;pointer-events:none}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:6px 16px}
.hr{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hr:last-child{border:0}
.hr span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:#4b5059}
.hr.sel{font-weight:700}.hr.sel span:last-child{color:var(--ink)}
.small{font-size:12px;color:var(--muted)}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.strip::-webkit-scrollbar{display:none}
.strip figure{flex:none;width:118px;height:118px;border-radius:16px;overflow:hidden;position:relative}
.strip img{width:100%;height:100%;object-fit:cover}
.strip figure button{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.92);cursor:pointer;font-size:15px;line-height:1}
.strip label{flex:none;width:118px;height:118px;border-radius:16px;border:1.5px dashed #d6d0c7;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;background:var(--card)}
.field{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 14px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:84px}
.frow{display:flex;gap:8px;margin-top:10px}
.frow .field{flex:1;min-width:0}
.frow .btn{padding:11px 18px;flex:none}
.lab{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
select.field{appearance:auto}
.cta{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));z-index:6}
.cta .stat{text-align:left}
.cta .stat b{font-family:var(--display);font-weight:400;font-size:22px}

/* plan */
.pitem{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border:0}
.num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex:none;border:0;cursor:pointer}
.num.done{background:#cfe7d8;color:var(--open)}
.pitem.done .rname{text-decoration:line-through;opacity:.5}
.mini{border:0;background:none;color:var(--muted);width:30px;height:30px;font-size:17px;cursor:pointer;flex:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:99px;padding:8px 0;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.steps{counter-reset:s;list-style:none;margin-top:6px}
.steps li{counter-increment:s;display:flex;gap:10px;padding:6px 0;font-size:14px}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent-dark);font-weight:700;font-size:12px;display:grid;place-items:center}

/* prefs & settings */
.pcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.pcard h3{font-size:19px;display:flex;align-items:center;gap:10px}
.pcard h3 i{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-style:normal;font-size:17px}
.pcard .small{margin:2px 0 10px 44px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.srow:last-child{border:0}
.ks{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.ks.ok{background:#e3f1e8;color:var(--open)}.ks.bad{background:#f8dddd;color:#a63a3a}.ks.none{background:var(--bg);color:var(--muted)}
#gmap{height:calc(100vh - 250px);min-height:380px;border-radius:var(--r);overflow:hidden;background:var(--line);box-shadow:var(--shadow);margin-top:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:13px;color:var(--muted);margin-top:10px}

/* bottom bar */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px max(6px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));z-index:5}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}
.tab.mid i{width:58px;height:58px;margin-top:-30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(212,98,46,.38);border:4px solid var(--card)}
.tab.mid.on i{background:var(--accent-dark)}
.badge{position:absolute;top:-30px;right:calc(50% - 32px);background:var(--ink);color:#fff;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px;font-style:normal;border:2px solid var(--card)}
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.sync{font-size:12px;color:var(--muted);text-align:center}
.sync:not(:empty){padding-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="app"></div>
  <nav class="tabs" id="tabs"></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= constants ================= */
const TZ='Europe/Madrid', HOME={lat:38.7895,lng:0.1730}, LS='xabiaEats.v1';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const FILTERS=['All','For you','Michelin','Bakery','Breakfast','Lunch','Dinner','Tapas','Seafood','Rice','Sea view','Drinks','Dessert'];
const ALL_TAGS=FILTERS.slice(3);
// Michelin Guide distinctions for Xàbia: 2026 Spain guide plus its March 2026 additions (Xàbia has no Bib Gourmands)
const MICH={'3':'★★★ 3 stars','2':'★★ 2 stars','1':'★ 1 star','bib':'Bib Gourmand','rec':'Michelin Guide'};

const pad=n=>String(n).padStart(2,'0');
const fmt=m=>{m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toUTC=d=>{const[y,m,dd]=d.split('-').map(Number);return Date.UTC(y,m-1,dd)};
const dowOf=d=>new Date(toUTC(d)).getUTCDay();
const addDays=(d,n)=>new Date(toUTC(d)+n*864e5).toISOString().slice(0,10);
const dayDiff=(a,b)=>Math.round((toUTC(b)-toUTC(a))/864e5);
const pretty=d=>{const[,m,dd]=d.split('-').map(Number);return `${DAYS[dowOf(d)]} ${dd} ${MONTHS[m-1]}`};
function madridNow(){

  return {date:`${p.year}-${p.month}-${p.day}`,min:(+p.hour%24)*60+ +p.minute};
}

const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7);
function isoOf(d){
  if(!d) return null;
  if(d instanceof Date) return (d.getUTCHours()===0&&d.getUTCMinutes()===0)?d.toISOString().slice(0,10):`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if(typeof d==='string') return d.slice(0,10);
  if(d.year) return `${d.year}-${pad(d.month)}-${pad(d.day)}`;
  if(d.date) return isoOf(d.date);
  return null;
}

/* ================= opening hours ================= */
function weekly(periods){
  if(!periods) return null;
  return periods.map(p=>{
    if(!p.close) return [0,20160];
    const s=p.open.day*1440+p.open.hour*60+p.open.minute;
    let e=p.close.day*1440+p.close.hour*60+p.close.minute; if(e<=s) e+=10080; return [s,e];
  });
}
function hoursFor(p,D){
  if(p.cur&&p.curFrom){const k=dayDiff(p.curFrom,D);if(k>=0&&k<7) return {w:p.cur,src:'current',special:(p.special||[]).includes(D)}}
  if(p.reg) return {w:p.reg,src:'regular',special:false};
  return null;
}
function dayRanges(w,dow){
  const a=dow*1440,b=a+1440,out=[];
  for(const[s,e]of w){
    if(e-s>=10080){out.push([0,1440]);continue}
    for(const off of [0,10080,-10080]){const ss=s+off,ee=e+off;if(ss<b&&ee>a&&ss>=a-1440) out.push([Math.max(ss,a)-a,Math.min(ee,b+600)-a])}
  }
  const seen=new Set();return out.filter(([s,e])=>{const k=s+'-'+e;if(seen.has(k)||s>=1440||s<0)return false;seen.add(k);return true}).sort((x,y)=>x[0]-y[0]);
}
const holidayOn=D=>data.holidays.find(h=>h.date===D);
// returns {s, big, small, txt}
function status(p,D,m){
  if(!D){({date:D,min:m}=when())}
  if((p.closedOn||[]).includes(D)) return {s:'closed',big:'Closed',small:'your note',txt:'Closed (your note)'};
  if(p.biz==='CLOSED_PERMANENTLY') return {s:'closed',big:'Closed',small:'permanently',txt:'Permanently closed'};
  if(p.biz==='CLOSED_TEMPORARILY') return {s:'closed',big:'Closed',small:'temporarily',txt:'Temporarily closed'};
  const h=hoursFor(p,D);
  if(!h) return {s:'unknown',big:'Hours',small:p.gid?'not listed':'not loaded',txt:p.gid?'No hours on Google':(data.key?'Hours loading…':'Hours need Google')};
  const t=dowOf(D)*1440+m;
  for(const[s,e]of h.w) for(const tt of [t,t+10080]) if(tt>=s&&tt<e){const all=e-s>=10080;return {s:'open',left:e-tt,big:'Open',small:all?'24 hours':`until ${fmt(e)}`,txt:all?'Open 24 hours':`Open until ${fmt(e)}`,h}}
  const dayEnd=(dowOf(D)+1)*1440; let next=null;
  for(const[s]of h.w) if(s>t&&s<dayEnd&&(next===null||s<next)) next=s;
  if(next!==null) return {s:'soon',wait:next-t,big:'Opens',small:`at ${fmt(next)}`,txt:`Opens at ${fmt(next)}`,h};
  const any=dayRanges(h.w,dowOf(D)).length;
  return {s:'closed',big:'Closed',small:any?'for the day':'all day',txt:any?'Closed for the day':'Closed all day',h};
}
function flagsFor(p,D){
  const hol=holidayOn(D), h=hoursFor(p,D);
  if(h&&h.special) return `<span class="flag ok">✓ ${hol?'Holiday':'Special'} hours confirmed</span>`;
  if(hol&&p.gid&&h&&h.src==='current') return `<span class="flag ok">✓ Checked for ${esc(hol.name)}</span>`;
  if(hol) return `<span class="flag warn">Holiday · call ahead</span>`;
  return '';
}

/* ================= preferences ================= */
function matches(p){
  const out=[],seen=new Set(),hay=[...(p.menu||[]),p.note||'',p.name,p.type||''].join(' | ').toLowerCase();
  ['Any venue',...p.tags].forEach(c=>(data.prefs[c]||[]).forEach(pref=>{
    const k=pref.toLowerCase().trim(); if(!k||seen.has(k)) return;
    let hit=(p.menu||[]).find(x=>x.toLowerCase().includes(k))||(hay.includes(k)||p.tags.some(t=>t.toLowerCase()===k)?pref:null);
    if(!hit){const g=GOOGLE_KW.find(([re,f])=>re.test(k)&&p.serves&&p.serves[f]);if(g) hit=pref}
    if(hit){seen.add(k);out.push(hit)}
  }));
  return out;
}

/* ================= Google ================= */
let gPromise=null;
function gmaps(){
  if(gPromise) return gPromise;
  if(!data.key) return Promise.reject(new Error('No Google key yet. Add one in Settings.'));
  gPromise=new Promise((res,rej)=>{
    window.__gmInit=async()=>{try{
      const [pl,mp,mk]=await Promise.all([window.google.maps.importLibrary('places'),window.google.maps.importLibrary('maps'),window.google.maps.importLibrary('marker')]);
      state.keyStatus='ok';res({Place:pl.Place,Map:mp.Map,Marker:mk.AdvancedMarkerElement,Pin:mk.PinElement});
    }catch(e){state.keyStatus='bad';rej(e)}};
    window.gm_authFailure=()=>{state.keyStatus='bad';toast('Google rejected the API key. Check it in Settings.');renderSoft()};
    const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(data.key)}&v=weekly&loading=async&callback=__gmInit&language=en&region=ES`;
    s.async=true;s.onerror=()=>{state.keyStatus='bad';rej(new Error('Couldn’t reach Google. Are you online?'))};
    document.head.append(s);
  });
  gPromise.catch(()=>renderSoft());
  return gPromise;
}
async function gSearch(q,max=8){
  const g=await gmaps();
  const {places}=await g.Place.searchByText({textQuery:q,fields:SEARCH_FIELDS,locationBias:{center:HOME,radius:9000},maxResultCount:max,language:'en',region:'es'});
  return (places||[]).map(x=>({gid:x.id,name:x.displayName,addr:x.formattedAddress,type:x.primaryTypeDisplayName,lat:x.location&&x.location.lat(),lng:x.location&&x.location.lng()}));
}
async function gDetails(gid){
  const g=await gmaps(), pl=new g.Place({id:gid});
  try{await pl.fetchFields({fields:DETAIL_FIELDS})}catch(e){await pl.fetchFields({fields:CORE_FIELDS})}
  return pl;
}
function applyDetails(p,pl){
  p.gid=pl.id; p.gname=pl.displayName||p.gname;
  p.addr=pl.formattedAddress||p.addr||'';
  if(pl.location){p.lat=pl.location.lat();p.lng=pl.location.lng();p.approx=false}
  p.phone=pl.internationalPhoneNumber||pl.nationalPhoneNumber||p.phone||'';
  p.web=pl.websiteURI||p.web||''; p.maps=pl.googleMapsURI||p.maps||'';
  p.rating=pl.rating??null; p.ratingCount=pl.userRatingCount??null;
  p.price=PRICE[String(pl.priceLevel||'').toUpperCase()]||'';
  p.type=pl.primaryTypeDisplayName||p.type||''; p.biz=String(pl.businessStatus||'').toUpperCase();
  const ro=pl.regularOpeningHours, co=pl.currentOpeningHours;
  p.reg=ro&&ro.periods?weekly(ro.periods):null;
  if(co&&co.periods){p.cur=weekly(co.periods);p.curFrom=madridNow().date;p.special=(co.specialDays||[]).map(isoOf).filter(Boolean)}else{p.cur=null;p.curFrom=null;p.special=[]}
  if(pl.photos) p.gphotos=pl.photos.slice(0,6).map(ph=>({src:ph.getURI({maxWidth:900,maxHeight:900}),by:(ph.authorAttributions||[]).map(a=>({name:a.displayName,uri:a.uri}))}));
  p.serves={coffee:pl.servesCoffee,breakfast:pl.servesBreakfast,brunch:pl.servesBrunch,lunch:pl.servesLunch,dinner:pl.servesDinner,beer:pl.servesBeer,wine:pl.servesWine,cocktails:pl.servesCocktails,dessert:pl.servesDessert,vegetarian:pl.servesVegetarianFood,outdoor:pl.hasOutdoorSeating};
  if(!p.autoTagged){
    const s=p.serves,types=pl.types||[],add=t=>{if(!p.tags.includes(t))p.tags.push(t)};
    if(s.breakfast||s.brunch)add('Breakfast'); if(s.lunch)add('Lunch'); if(s.dinner)add('Dinner');
    if(s.cocktails)add('Drinks'); if(s.dessert)add('Dessert');
    if(types.includes('bakery'))add('Bakery'); if(types.includes('seafood_restaurant'))add('Seafood');
    p.autoTagged=true;
  }
  p.updated=Date.now(); p.linkFailed=false;
}
let syncing=false;
async function syncAll(force){
  if(!data.key||syncing) return; syncing=true;
  const today=madridNow().date;
  const todo=data.places.filter(p=>force||!p.gid||!p.updated||p.curFrom!==today||Date.now()-p.updated>12*36e5).filter(p=>force||!p.linkFailed);
  let i=0,ok=0;
  for(const p of todo){
    i++; state.sync=`Updating from Google… ${i} of ${todo.length}`; renderSync();
    try{
      if(!p.gid){const r=await gSearch(p.query||`${p.name}, Xàbia`,1);if(!r.length){p.linkFailed=true;continue}p.gid=r[0].gid}
      applyDetails(p,await gDetails(p.gid)); save(); ok++;
    }catch(e){console.warn(p.name,e);if(state.keyStatus==='bad')break}
  }
  syncing=false; state.sync=state.keyStatus==='bad'?'':(todo.length?`Updated ${ok} of ${todo.length} places from Google`:''); save(); renderSoft();
  setTimeout(()=>{state.sync='';renderSync()},4000);
}

const igLink=h=>`https://www.instagram.com/${encodeURIComponent(h.replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,''))}/`;
function routeUrl(list){
  const d=list[list.length-1],w=list.slice(0,-1);
  let u=`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(qName(d))}`;
  if(d.gid)u+=`&destination_place_id=${d.gid}`;
  if(w.length){u+='&waypoints='+encodeURIComponent(w.map(qName).join('|'));if(w.every(p=>p.gid))u+='&waypoint_place_ids='+encodeURIComponent(w.map(p=>p.gid).join('|'))}
  return u+'&travelmode='+data.travel;
}
function kml(list){
  const x=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Xàbia Eats</name>\n${list.filter(p=>p.lat!=null).map(p=>`<Placemark><name>${x(p.name)}</name><description>${x([p.tags.join(', '),p.addr,p.note,mapsLink(p)].filter(Boolean).join(' — '))}</description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join('\n')}\n</Document></kml>`;
}
function download(name,text,type){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast(`${name} saved`)}

}

function dayOptions(){
  const today=madridNow().date, set=new Set();
  for(let i=0;i<7;i++) set.add(addDays(today,i));
  const {from,to}=data.trip;
  if(from&&to&&dayDiff(from,to)>=0&&dayDiff(from,to)<45) for(let d=from;dayDiff(d,to)>=0;d=addDays(d,1)) if(dayDiff(today,d)>=0) set.add(d);
  set.add(when().date);
  return [...set].sort();
}

const DISC_FIELDS=['id','displayName','formattedAddress','location','rating','userRatingCount','priceLevel','primaryTypeDisplayName','types','regularOpeningHours','currentOpeningHours','googleMapsURI','websiteURI','nationalPhoneNumber','businessStatus','photos'];
const MICH_BONUS={'3':.8,'2':.6,'1':.4,bib:.25,rec:.15};
function defaultCat(min){return min<660?'breakfast':min<750?'bakery':min<990?'lunch':min<1170?'drinks':'dinner'}
const catOf=()=>CATS.find(c=>c.k===(state.cat||defaultCat(when().min)));
function score(p){
  const r=p.rating??4.0, c=p.ratingCount||0;
  return r+Math.min(.2,.05*Math.log10(1+c))+.12*matches(p).length+(MICH_BONUS[p.michelin]||0)+(p.disc?0:.05);
}
async function discover(cat,force){
  if(!data.key||!data.discover) return;
  const today=madridNow().date, c=data.disc[cat.k];
  if(!force&&c&&c.date===today&&Date.now()-c.at<6*36e5) return;
  if(state.discBusy===cat.k) return;
  state.discBusy=cat.k; renderDiscNote();
  try{
    const g=await gmaps();
    const {places}=await g.Place.searchByText({textQuery:`${cat.q} in Xàbia, Alicante`,fields:DISC_FIELDS,locationBias:{center:HOME,radius:7000},maxResultCount:20,language:'en',region:'es'});
    data.disc[cat.k]={at:Date.now(),date:today,items:(places||[]).map(pl=>{
      const area=Object.keys(AREAS).find(a=>(pl.formattedAddress||'').toLowerCase().includes(a.toLowerCase()))||'Xàbia';
      const p={id:'g_'+pl.id,name:pl.displayName,area,tags:[...cat.tags],menu:[],note:'',disc:true,michelin:''};
      applyDetails(p,pl); return p;
    })};
    save();
  }catch(e){console.warn(e)}
  state.discBusy=null; renderSoft();
}
const allDisc=()=>Object.values(data.disc||{}).flatMap(c=>c.items||[]);
function candidates(cat){
  const saved=data.places.filter(p=>cat.tags.some(t=>p.tags.includes(t)));
  const gids=new Set(data.places.map(p=>p.gid).filter(Boolean));
  const disc=data.discover&&data.disc[cat.k]?data.disc[cat.k].items.filter(p=>!gids.has(p.gid)&&(p.ratingCount||0)>=15):[];
  let all=[...saved,...disc];
  if(data.only4) all=all.filter(p=>p.rating==null||p.rating>=4);
  return all;
}

function renderList(){
  const el=document.getElementById('list'); if(!el) return;
  const cat=catOf(), list=candidates(cat);
  const S=new Map(list.map(p=>[p.id,status(p)])), SC=new Map(list.map(p=>[p.id,score(p)]));
  const by=s=>list.filter(p=>S.get(p.id).s===s).sort((a,b)=>SC.get(b.id)-SC.get(a.id));
  const open=by('open'), soon=by('soon'), closed=by('closed'), unk=by('unknown');
  const pick=open[0]||null;
  const waitPool=soon.filter(p=>S.get(p.id).wait<=150);
  // 'much better' = Google rating at least 0.3 higher, or clearly higher overall score
  const wait=waitPool.find(p=>!pick||(p.rating!=null&&pick.rating!=null&&p.rating>=pick.rating+.3)||SC.get(p.id)>=SC.get(pick.id)+.25)||null;
  const rest=open.slice(1), later=soon.filter(p=>p!==wait);
  state.recPins=[...(pick?[[pick,'pick']]:[]),...(wait?[[wait,'wait']]:[]),...rest.slice(0,12).map(p=>[p,'open']),...later.slice(0,6).map(p=>[p,'soon'])];
  const label=state.when?`at ${fmt(when().min)}`:'now';
  let html='';
  if(data.key) html+=`<div class="pad"><div id="recmap"><div class="empty" style="padding-top:110px">Loading map…</div></div>
     <div class="legend"><span class="lg pick">Our pick</span><span class="lg wait">Worth the wait</span><span class="s-open"><span class="dotc">Open</span></span><span class="s-soon"><span class="dotc">Later</span></span></div></div>`;
  if(pick) html+=`<div class="pad" style="margin-top:16px">${heroCard(pick,'pick',S.get(pick.id))}</div>`;
  else if(list.length&&!unk.length) html+=`<div class="pad"><div class="note" style="background:var(--card)">Nothing in <b>${esc(cat.label.toLowerCase())}</b> is open ${label}${data.only4?' with 4★ or more':''}.</div></div>`;
  if(wait) html+=`<div class="pad" style="margin-top:14px">${heroCard(wait,'wait',S.get(wait.id))}</div>`;
  if(rest.length) html+=`<div class="pad">${sec(`Also open ${label}`,`${rest.length}`)}<div class="list">${rest.map(row).join('')}</div></div>`;
  if(later.length) html+=`<div class="pad">${sec('Opening later',`${later.length}`)}<div class="list">${later.map(row).join('')}</div></div>`;
  if(unk.length) html+=`<div class="pad">${sec(data.key?'Hours unknown':'Your saved places',`${unk.length}`)}<div class="list">${unk.map(row).join('')}</div></div>`;
  if(closed.length) html+=`<div class="pad">${state.showClosed?`${sec('Closed',`${closed.length}`)}<div class="list">${closed.map(row).join('')}</div>`:`<button class="link" style="display:block;margin:16px auto 0" onclick="state.showClosed=true;renderList()">Show ${closed.length} closed place${closed.length>1?'s':''}</button>`}</div>`;
  if(!list.length) html+=`<div class="pad"><div class="note" style="background:var(--card)">No ${esc(cat.label.toLowerCase())} places yet${data.only4?' rated 4★ or more':''}. ${data.key?'':'Connect Google to find some, or '}add one from Saved.</div></div>`;
  html+=`<div class="pad"><p class="small" style="text-align:center;margin-top:18px">Times are Xàbia time. Picks weigh Google rating, your ♥ preferences and Michelin.</p></div>`;
  el.innerHTML=html;
  renderDiscNote();
  drawRecMap();
}
async function drawRecMap(){
  const el=document.getElementById('recmap'); if(!el) return;
  try{
    const g=await gmaps(); if(!document.body.contains(el)) return;
    el.innerHTML='';
    const map=new g.Map(el,{center:HOME,zoom:13,mapId:'DEMO_MAP_ID',disableDefaultUI:true,zoomControl:true,gestureHandling:'cooperative',clickableIcons:false});
    const b=new window.google.maps.LatLngBounds(); let n=0;
    const style={pick:{bg:'#d4622e',sc:1.45,gl:'★'},wait:{bg:'#c0771a',sc:1.25,gl:'⏱'},open:{bg:'#2c8553',sc:.9},soon:{bg:'#e3b46f',sc:.8}};
    [...(state.recPins||[])].reverse().forEach(([p,k])=>{
      if(p.lat==null||p.approx) return;
      const s=style[k], pin=new g.Pin({background:s.bg,borderColor:'#ffffff',glyphColor:'#ffffff',scale:s.sc,...(s.gl?{glyph:s.gl}:{})});
      const mk=new g.Marker({map,position:{lat:p.lat,lng:p.lng},title:p.name,content:pin.element||pin,gmpClickable:true,zIndex:k==='pick'?99:k==='wait'?98:1});
      mk.addListener('click',()=>openDetail(p.id)); b.extend({lat:p.lat,lng:p.lng}); n++;
    });
    if(n>1) map.fitBounds(b,36); else if(n===1) map.setCenter(b.getCenter?b.getCenter():HOME);
    if(!n) el.innerHTML='<div class="empty" style="padding-top:110px">Nothing to show on the map yet.</div>';
  }catch(e){el.innerHTML=`<div class="empty" style="padding-top:100px">The map couldn’t load.<br>${esc(e.message||'')}</div>`}
}

// Shrinks photos to ~800px JPEGs so they fit in the phone's storage
function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=u})}
async function addPhotos(id,input){
  const p=byId(id);p.myPhotos=p.myPhotos||[];const files=[...input.files].slice(0,6);let n=0;
  for(const f of files){try{p.myPhotos.push({src:await shrink(f)});n++}catch(e){toast('That image couldn’t be read')}}
  try{localStorage.setItem(LS,JSON.stringify(data));toast(n>1?`${n} photos saved`:'Photo saved')}catch(e){p.myPhotos.splice(-n,n);save();toast('Phone storage is full. Remove some photos first.')}

}

async function drawMap(){
  const el=document.getElementById('gmap'); if(!el) return;
  try{
    const g=await gmaps(); if(!document.body.contains(el)) return;
    el.innerHTML='';
    const map=new g.Map(el,{center:HOME,zoom:13,mapId:'DEMO_MAP_ID',disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy',clickableIcons:false});
    const b=new window.google.maps.LatLngBounds(); let n=0;
    data.places.forEach(p=>{
      if(p.lat==null||p.approx) return;
      const st=status(p), big=data.plan.includes(p.id);
      const pin=new g.Pin({background:big?'#d4622e':COL[st.s],borderColor:'#ffffff',glyphColor:'#ffffff',scale:big?1.25:1});
      const mk=new g.Marker({map,position:{lat:p.lat,lng:p.lng},title:p.name,content:pin.element||pin,gmpClickable:true});
      mk.addListener('click',()=>openDetail(p.id)); b.extend({lat:p.lat,lng:p.lng}); n++;
    });

  ${sec('Your data')}
  <div class="pcard">
    <p class="small" style="margin:0">Everything is saved on this device. Use a backup to move it to another phone or computer.</p>
    <button class="btn ghost block" onclick="exportBackup()">Download backup</button>
    <label class="btn ghost block" for="imp">Restore from backup</label><input type="file" id="imp" accept=".json,application/json" hidden onchange="importBackup(this)">
    <button class="btn danger block" onclick="resetAll()">${state.confirmDel==='ALL'?'Tap again to erase everything':'Start over with the starter list'}</button>
  </div>
  <p class="small" style="margin-top:14px">The starter list comes from the Guía Repsol 2026 list for Xàbia, javea.com and Nothing Familiar’s Jávea guide. Michelin badges follow the 2026 Michelin Guide Spain plus its March 2026 additions; the 2027 guide may change them, and you can edit each place’s badge. Hours, photos and ratings come from Google Maps.</p>
  </div>`;
}
function saveKey(k){k=k.trim();if(k===data.key){toast('Key unchanged');return}data.key=k;save();toast(k?'Key saved. Reloading…':'Key removed');setTimeout(()=>location.reload(),600)}
function addHol(f){if(!f.d.value)return;data.holidays.push({date:f.d.value,name:f.n.value.trim()||'Holiday'});save();render(true)}
function rmHol(d){const i=data.holidays.findIndex(h=>h.date===d);if(i>=0)data.holidays.splice(i,1);save();render(true)}
function resetAll(){
  if(state.confirmDel!=='ALL'){state.confirmDel='ALL';render(true);return}
  const key=data.key;data=defaultData();data.key=key;state.confirmDel=null;save();toast('Starter list restored');render();syncAll();
}

/* ================= nav & render ================= */
function saveDisc(id){
  const d=byId(id); if(!d||!d.disc) return id;
  const ex=data.places.find(p=>p.gid===d.gid); if(ex) return ex.id;
  const p=JSON.parse(JSON.stringify(d)); p.id=uid(); delete p.disc; data.places.push(p); save();
  const top=state.stack.at(-1); if(top==='detail:'+id) state.stack[state.stack.length-1]='detail:'+p.id;
  return p.id;
}
function savePlace(id){const nid=saveDisc(id);toast(`${byId(nid).name} saved to your places`);render(true)}
function togglePlan(id){
  if(byId(id)?.disc) id=saveDisc(id);
  const i=data.plan.indexOf(id), p=byId(id);
  if(i>=0){data.plan.splice(i,1);data.done=data.done.filter(x=>x!==id);toast('Removed from your plan')}else{data.plan.push(id);toast(`${p.name} added to your plan`)}
  save(); render(true);
}
let toastT;
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2000)}
function push(s){state.confirmDel=null;state.stack.push(s);render()}
function pop(){state.confirmDel=null;state.stack.pop();render()}
function openDetail(id){push('detail:'+id)}

const TABS=[['today','Home',I.home],['saved','Saved',I.heart],['plan','Plan',I.route],['map','Map',I.map],['prefs','Prefs',I.sliders]];
function renderTabs(){
  const top=state.stack.at(-1), hide=top&&top.startsWith('detail:');
  document.getElementById('phone').classList.toggle('detail',!!hide);
  const t=document.getElementById('tabs'); t.hidden=!!hide; if(hide) return;
  t.innerHTML=TABS.map(([k,l,ic])=>{const on=state.tab===k&&!state.stack.length;
    return k==='plan'?`<button class="tab mid ${on?'on':''}" onclick="go('plan')" aria-label="Plan"><i>${ic}</i>${l}${data.plan.length?`<em class="badge">${data.plan.length}</em>`:''}</button>`
      :`<button class="tab ${on?'on':''}" onclick="go('${k}')">${ic}${l}</button>`}).join('');
}
function go(k){state.tab=k;state.stack=[];state.confirmDel=null;render()}
function renderSync(){const el=document.getElementById('sync');if(el)el.textContent=state.sync}
// re-render after background work, but never while someone is typing
function renderSoft(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return renderSync();if(state.tab==='map'&&!state.stack.length)return renderSync();render(true)}
function render(keepScroll){
  const app=document.getElementById('app'), top=state.stack.at(-1);
  let html;
  if(top==='add') html=screenAdd();
  else if(top==='settings') html=screenSettings();
  else if(top&&top.startsWith('relink:')) html=screenAdd(top.slice(7));
  else if(top&&top.startsWith('detail:')) html=screenDetail(top.slice(7));
  else html={today:screenToday,saved:screenSaved,map:screenMap,plan:screenPlan,prefs:screenPrefs}[state.tab]();
  const af=document.activeElement, fid=af&&af.id, pos=fid&&af.selectionStart!=null?af.selectionStart:null, y=window.scrollY;
  const rails=[...document.querySelectorAll('.rail')].map(r=>r.scrollLeft);
  app.innerHTML=html;
  document.querySelectorAll('.rail').forEach((r,i)=>{if(keepScroll&&rails[i])r.scrollLeft=rails[i]});
  if(!top&&state.tab==='today') {renderList();document.querySelectorAll('.rail').forEach((r,i)=>{if(keepScroll&&rails[i])r.scrollLeft=rails[i]})}
  if(!top&&state.tab==='map') drawMap();
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(pos!=null&&el.setSelectionRange)try{el.setSelectionRange(pos,pos)}catch(e){}}}
  window.scrollTo(0,keepScroll?y:0);
  renderTabs();
}
render();
if(data.key) gmaps().then(()=>{renderSoft();syncAll()}).catch(()=>{});
setInterval(()=>{if(!state.when&&!state.stack.length&&state.tab==='today'){const t=document.getElementById('tm');if(t)t.textContent=fmt(madridNow().min);renderList()}},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&data.key&&state.keyStatus==='ok')syncAll()});
</script>
</body>
</html>
